<head>

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        h2, h4, .primary-btn, .meta-strip {
            font-family: 'Orbitron', sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .routine-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 15px;
        }
        .back-btn {
            font-size: 20px;
            color: #FF5500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
        }
        .routine-header h2 { margin: 0; font-size: 18px; text-transform: uppercase; color: #fff; }

        .meta-strip {
            display: flex;
            justify-content: space-between;
            background-color: #0c0c0c;
            border: 1px solid #222;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .meta-strip span i { color: #FF5500; margin-right: 5px; }

        .exercise-list { display: flex; flex-direction: column; gap: 20px; }
        .exercise-card {
            background-color: #080808;
            border: 1px solid #1c1c1c;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .ex-info h4 { margin: 0 0 6px 0; font-size: 16px; color: #fff; text-transform: uppercase; }
        .ex-info p { margin: 0; font-size: 14px; color: #888; font-weight: 700; }
        .ex-info p span { color: #FF5500; }
        .ex-note { font-size: 13px; color: #666; margin-top: 4px; font-style: italic; }

        /* Motion Track Studio Box - Matching 1000060022.jpg aesthetic with a clean white/studio light feel */
        .motion-track-container {
            width: 100%; 
            height: 200px; 
            background: radial-gradient(circle at center, #ffffff 0%, #e2e8f0 100%);
            border: 1px solid #ffffff; 
            border-radius: 10px;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            position: relative; 
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
        }

        .motion-svg { height: 85%; width: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15)); }
        
        /* Figure Art Design & Nodes */
        .hologram-body { fill: #1e293b; opacity: 0.85; }
        .hologram-bench, .hologram-weight { fill: #475569; stroke: #334155; stroke-width: 1.5; }
        .hologram-weight-glow { fill: #ff5500; opacity: 0.2; }
        
        /* Tracking Skeleton Overlay Line styling matching 1000060022.jpg */
        .track-bone { stroke: #ffffff; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.95; }
        .track-joint { fill: #ffffff; stroke: rgba(255, 85, 0, 0.8); stroke-width: 2; }
        .track-pulse { fill: none; stroke: #ffffff; stroke-width: 1; animation: nodePulse 2s infinite; opacity: 0.5; }

        @keyframes nodePulse {
            0% { r: 3; opacity: 0.8; }
            100% { r: 9; opacity: 0; }
        }

        /* Scanline Overlay styling */
        .hud-overlay {
            position: absolute; top: 10px; left: 10px;
            font-family: 'Orbitron', sans-serif; font-size: 10px; color: #ff5500;
            background: rgba(0, 0, 0, 0.05); padding: 4px 6px; border-radius: 4px;
            border-left: 2px solid #ff5500; font-weight: 800; letter-spacing: 1px;
        }

        .primary-btn {
            width: 100%; padding: 16px; background-color: #FF5500; color: black;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 900;
            cursor: pointer; text-transform: uppercase; margin-top: 30px;
        }
    </style>
</head>
