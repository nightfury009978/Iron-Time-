<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRONTIME - Active Workout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h2, h4, .primary-btn, .meta-strip {
            font-family: 'Orbitron', sans-serif;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .routine-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 15px;
        }
        .back-btn {
            font-size: 20px;
            color: #FF5500;
            cursor: pointer;
            background: none;
            border: none;
            padding: 5px 10px;
        }
        .routine-header h2 { margin: 0; font-size: 18px; text-transform: uppercase; color: #fff; }

        .meta-strip {
            display: flex;
            justify-content: space-between;
            background-color: #0c0c0c;
            border: 1px solid #222;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .meta-strip span i { color: #FF5500; margin-right: 5px; }

        .exercise-list { display: flex; flex-direction: column; gap: 20px; }
        .exercise-card {
            background-color: #080808;
            border: 1px solid #1c1c1c;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; }
        .ex-info h4 { margin: 0 0 6px 0; font-size: 16px; color: #fff; text-transform: uppercase; }
        .ex-info p { margin: 0; font-size: 14px; color: #888; font-weight: 700; }
        .ex-info p span { color: #FF5500; }
        .ex-note { font-size: 13px; color: #666; margin-top: 4px; font-style: italic; }

        /* Anatomy Box Layout Setup Matching 1000048956.jpg Blueprint Look */
        .anatomy-preview-container {
            width: 100%; height: 180px; background-color: #040404;
            border: 1px dashed rgba(255, 85, 0, 0.3); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
        }
        .anatomy-preview-container::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(255, 85, 0, 0) 96%, rgba(255, 85, 0, 0.08) 96%), linear-gradient(90deg, rgba(255, 85, 0, 0) 96%, rgba(255, 85, 0, 0.08) 96%);
            background-size: 12px 12px; pointer-events: none;
        }
        .anatomy-svg { height: 90%; width: auto; }
        .muscle-base { fill: #222222; stroke: #333333; stroke-width: 1.5; }
        
        .muscle-glow { 
            fill: #FF1E00 !important; stroke: #FF5500 !important;
            filter: drop-shadow(0 0 8px #FF1E00);
            animation: muscularPulse 1.5s infinite ease-in-out alternate;
        }
        @keyframes muscularPulse {
            0% { fill: #FF1E00; filter: drop-shadow(0 0 4px #FF1E00); }
            100% { fill: #FF5500; filter: drop-shadow(0 0 12px #FF2200); }
        }

        .laser-scan-line {
            position: absolute; width: 100%; height: 2px; background-color: #FF5500;
            box-shadow: 0 0 8px #FF5500; top: 0; left: 0; animation: scanMove 3.5s infinite linear; opacity: 0.4;
        }
        @keyframes scanMove { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }

        .primary-btn {
            width: 100%; padding: 16px; background-color: #FF5500; color: black;
            border: none; border-radius: 8px; font-size: 16px; font-weight: 900;
            cursor: pointer; text-transform: uppercase; margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="routine-header">
            <button class="back-btn" onclick="goBack()"><i class="fa-solid fa-arrow-left"></i></button>
            <h2 id="routine-panel-title">WORKOUT PLAN</h2>
        </div>

        <div class="meta-strip">
            <span><i class="fa-solid fa-clock"></i> Duration: ~45m</span>
            <span><i class="fa-solid fa-stopwatch"></i> Rest: 60s</span>
            <span><i class="fa-solid fa-dumbbell"></i> Target: <span id="meta-target-summary">Body</span></span>
        </div>

        <div id="dynamic-exercise-list-box" class="exercise-list">
            <!-- Programmatic injection container -->
        </div>

        <button class="primary-btn" onclick="goBack()">Finish Routine</button>
    </div>

    <script>
        // Completely rewritten clean exercise database matching your exact request
        const explicitRoutineDatabase = {
            "Monday": [
                { name: "Dumbbell Floor Press", volume: "4 Sets x 15 Reps", targetGroup: "Chest", note: "Targets chest without a bench", activeId: "chest" },
                { name: "Standard Push-ups", volume: "4 Sets x 12 Reps", targetGroup: "Chest", note: "Drop to knees if form breaks", activeId: "chest" },
                { name: "Decline Push-ups", volume: "3 Sets x 10 Reps", targetGroup: "Upper Chest", note: "Feet elevated on a chair or bed", activeId: "chest" },
                { name: "Overhead Dumbbell Tricep Extension", volume: "4 Sets x 12 Reps", targetGroup: "Triceps", note: "Hold one or both weights", activeId: "arms" },
                { name: "Chair or Bench Dips", volume: "3 Sets x 15 Reps", targetGroup: "Triceps", note: "Keep feet close for easier, straight for harder", activeId: "arms" },
                { name: "Diamond Push-ups", volume: "3 Sets x Failure", targetGroup: "Triceps Focus", note: "Hands close together to torch triceps", activeId: "arms" }
            ],
            "Thursday": [
                { name: "Dumbbell Floor Press", volume: "4 Sets x 15 Reps", targetGroup: "Chest", note: "Targets chest without a bench", activeId: "chest" },
                { name: "Standard Push-ups", volume: "4 Sets x 12 Reps", targetGroup: "Chest", note: "Drop to knees if form breaks", activeId: "chest" },
                { name: "Decline Push-ups", volume: "3 Sets x 10 Reps", targetGroup: "Upper Chest", note: "Feet elevated on a chair or bed", activeId: "chest" },
                { name: "Overhead Dumbbell Tricep Extension", volume: "4 Sets x 12 Reps", targetGroup: "Triceps", note: "Hold one or both weights", activeId: "arms" },
                { name: "Chair or Bench Dips", volume: "3 Sets x 15 Reps", targetGroup: "Triceps", note: "Keep feet close for easier, straight for harder", activeId: "arms" },
                { name: "Diamond Push-ups", volume: "3 Sets x Failure", targetGroup: "Triceps Focus", note: "Hands close together to torch triceps", activeId: "arms" }
            ],
            "Tuesday": [
                { name: "Dumbbell Shoulder Press", volume: "4 Sets x 12 Reps", targetGroup: "Shoulders", note: "Seated or standing", activeId: "shoulders" },
                { name: "Dumbbell Lateral Raises", volume: "4 Sets x 15 Reps", targetGroup: "Lateral Delts", note: "Focus on slow, controlled movement", activeId: "shoulders" },
                { name: "Dumbbell Rear Delt Flyes", volume: "4 Sets x 15 Reps", targetGroup: "Rear Delts", note: "Hinged at hips to target back of shoulders", activeId: "shoulders" },
                { name: "Dumbbell Bicep Curls", volume: "4 Sets x 12 Reps", targetGroup: "Biceps", note: "Turn wrists upward at the top", activeId: "arms" },
                { name: "Dumbbell Hammer Curls", volume: "4 Sets x 12 Reps", targetGroup: "Biceps/Brachialis", note: "Palms facing each other", activeId: "arms" },
                { name: "Pike Push-ups", volume: "3 Sets x 8-10 Reps", targetGroup: "Anterior Delts", note: "Hips high in the air to shift weight to shoulders", activeId: "shoulders" }
            ],
            "Friday": [
                { name: "Dumbbell Shoulder Press", volume: "4 Sets x 12 Reps", targetGroup: "Shoulders", note: "Seated or standing", activeId: "shoulders" },
                { name: "Dumbbell Lateral Raises", volume: "4 Sets x 15 Reps", targetGroup: "Lateral Delts", note: "Focus on slow, controlled movement", activeId: "shoulders" },
                { name: "Dumbbell Rear Delt Flyes", volume: "4 Sets x 15 Reps", targetGroup: "Rear Delts", note: "Hinged at hips to target back of shoulders", activeId: "shoulders" },
                { name: "Dumbbell Bicep Curls", volume: "4 Sets x 12 Reps", targetGroup: "Biceps", note: "Turn wrists upward at the top", activeId: "arms" },
                { name: "Dumbbell Hammer Curls", volume: "4 Sets x 12 Reps", targetGroup: "Biceps/Brachialis", note: "Palms facing each other", activeId: "arms" },
                { name: "Pike Push-ups", volume: "3 Sets x 8-10 Reps", targetGroup: "Anterior Delts", note: "Hips high in the air to shift weight to shoulders", activeId: "shoulders" }
            ],
            "Wednesday": [
                { name: "Dumbbell Goblet Squats", volume: "4 Sets x 15 Reps", targetGroup: "Quads/Glutes", note: "Hold one 5kg weight close to your chest", activeId: "quads" },
                { name: "Dumbbell Bulgarian Split Squats", volume: "3 Sets x 12 Reps (per leg)", targetGroup: "Quadriceps Focus", note: "Back foot elevated on a chair", activeId: "quads" },
                { name: "Dumbbell Romanian Deadlifts", volume: "4 Sets x 15 Reps", targetGroup: "Hamstrings", note: "Slight bend in knees, hinge at hips", activeId: "hamstrings" },
                { name: "Walking Lunges", volume: "3 Sets x 20 Total Steps", targetGroup: "Legs Dynamic", note: "Hold dumbbells at your sides", activeId: "quads" },
                { name: "Calf Raises", volume: "4 Sets x 20 Reps", targetGroup: "Calves", note: "Hold weights to add resistance", activeId: "calves" },
                { name: "Plank Shoulder Taps", volume: "3 Sets x 45 Seconds", targetGroup: "Abs / Core", note: "Core stability finisher", activeId: "abs" }
            ],
            "Saturday": [
                { name: "Dumbbell Goblet Squats", volume: "4 Sets x 15 Reps", targetGroup: "Quads/Glutes", note: "Hold one 5kg weight close to your chest", activeId: "quads" },
                { name: "Dumbbell Bulgarian Split Squats", volume: "3 Sets x 12 Reps (per leg)", targetGroup: "Quadriceps Focus", note: "Back foot elevated on a chair", activeId: "quads" },
                { name: "Dumbbell Romanian Deadlifts", volume: "4 Sets x 15 Reps", targetGroup: "Hamstrings", note: "Slight bend in knees, hinge at hips", activeId: "hamstrings" },
                { name: "Walking Lunges", volume: "3 Sets x 20 Total Steps", targetGroup: "Legs Dynamic", note: "Hold dumbbells at your sides", activeId: "quads" },
                { name: "Calf Raises", volume: "4 Sets x 20 Reps", targetGroup: "Calves", note: "Hold weights to add resistance", activeId: "calves" },
                { name: "Plank Shoulder Taps", volume: "3 Sets x 45 Seconds", targetGroup: "Abs / Core", note: "Core stability finisher", activeId: "abs" }
            ],
            "Sunday": [
                { name: "Active Recovery Plan", volume: "Light Intensity", targetGroup: "Full Body Rest", note: "Complete rest, light walking, or full-body stretching.", activeId: "rest" }
            ]
        };

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const day = urlParams.get('day') || 'Monday';

            document.getElementById('routine-panel-title').innerText = `${day.toUpperCase()} SPLIT`;
            
            const targetSummary = {
                "Monday": "Chest & Tri", "Thursday": "Chest & Tri",
                "Tuesday": "Shoulders & Bi", "Friday": "Shoulders & Bi",
                "Wednesday": "Legs & Abs", "Saturday": "Legs & Abs",
                "Sunday": "Recovery"
            };
            document.getElementById('meta-target-summary').innerText = targetSummary[day] || "Body";

            const container = document.getElementById('dynamic-exercise-list-box');
            container.innerHTML = '';

            let workoutPool = explicitRoutineDatabase[day] || [];

            workoutPool.forEach(ex => {
                // Glow classes applied to SVG fragments
                const isChest = ex.activeId === 'chest' ? 'muscle-glow' : '';
                const isShoulders = ex.activeId === 'shoulders' ? 'muscle-glow' : '';
                const isArms = ex.activeId === 'arms' ? 'muscle-glow' : '';
                const isAbs = ex.activeId === 'abs' ? 'muscle-glow' : '';
                const isQuads = ex.activeId === 'quads' ? 'muscle-glow' : '';
                const isHams = ex.activeId === 'hamstrings' ? 'muscle-glow' : '';
                const isCalves = ex.activeId === 'calves' ? 'muscle-glow' : '';

                const cardHtml = `
                    <div class="exercise-card">
                        <div class="card-top-row">
                            <div class="ex-info">
                                <h4>${ex.name}</h4>
                                <p>Volume: <span>${ex.volume}</span></p>
                                <div class="ex-note">${ex.note}</div>
                            </div>
                        </div>
                        
                        <div class="anatomy-preview-container">
                            <div class="laser-scan-line"></div>
                            <svg class="anatomy-svg" viewBox="0 0 120 240" xmlns="http://www.w3.org/2000/svg">
                                <circle cx="60" cy="25" r="12" class="muscle-base"/>
                                <!-- Chest -->
                                <path d="M42 42h36v25h-36z" class="muscle-base ${isChest}"/>
                                <!-- Abs -->
                                <path d="M42 67h36v25h-36z" class="muscle-base ${isAbs}"/>
                                <!-- Shoulders -->
                                <path d="M32 42l10 15h-8z" class="muscle-base ${isShoulders}"/>
                                <path d="M78 42l10 15h-8z" class="muscle-base ${isShoulders}"/>
                                <!-- Arms -->
                                <path d="M24 57h8v35h-8z" class="muscle-base ${isArms}"/>
                                <path d="M88 57h8v35h-8z" class="muscle-base ${isArms}"/>
                                <path d="M45 92h30l5 20h-40z" class="muscle-base"/>
                                <!-- Lower Legs Split Mapping System Layout -->
                                <path d="M45 112h14v55h-14z" class="muscle-base ${isQuads} ${isHams}"/>
                                <path d="M61 112h14v55h-14z" class="muscle-base ${isQuads} ${isHams}"/>
                                <path d="M47 172h11v45h-11z" class="muscle-base ${isCalves}"/>
                                <path d="M62 172h11v45h-11z" class="muscle-base ${isCalves}"/>
                                <path d="M44 217h14l4 6h-18zM62 217h14l4 6h-18z" class="muscle-base"/>
                            </svg>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);
            });
        });

        function goBack() {
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
