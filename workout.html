<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IRON TIME - Workout</title>
<meta name="theme-color" content="#f4f2ed">
<script>(function(){try{var l=JSON.parse(localStorage.getItem('ironTimeLook2'))||{},r=document.documentElement;r.dataset.theme=l.t||'platinum';if(l.h)r.style.setProperty('--fh',"'"+l.h+"',sans-serif");if(l.b)r.style.setProperty('--fb',"'"+l.b+"',system-ui,sans-serif")}catch(e){}})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Manrope:wght@500;600;700&family=Space+Grotesk:wght@500;700&family=Outfit:wght@500;700;800&family=Unbounded:wght@500;700;800&family=Playfair+Display:wght@600;800&family=Orbitron:wght@700;900&family=Inter:wght@500;600;700&family=DM+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070a;--s1:#0e0e13;--s2:#15151c;--line:rgba(255,255,255,.08);--tx:#f4f1ea;--mute:#8d8a94;--e1:#ff8a2a;--e2:#ff3d00;--gold:#f5c26b;--ok:#3ddc97;--okrgb:61,220,151;--ac:255,138,42;--ac2:255,61,0;--onac:var(--onac);--g1:#ffffff;--g2:#f5c26b;--g3:#ff8a2a;--drawer:var(--drawer);--fh:var(--fh);--fb:var(--fb);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fb)}
body{min-height:100vh;overflow-x:hidden;background:radial-gradient(600px 400px at 85% -5%,rgba(var(--ac),.14),transparent 70%),radial-gradient(500px 400px at -10% 30%,rgba(var(--ac2),.06),transparent 70%),var(--bg)}
button{font-family:inherit;color:inherit;cursor:pointer}

h1,h2,h3{font-family:var(--fh);margin:0}
/* splash */
#splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;transition:opacity .6s,visibility .6s}
#splash.hide{opacity:0;visibility:hidden}
#splash:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(var(--ac),.28),transparent 65%);animation:pulse 2s ease-in-out infinite}
.bell{position:relative;display:flex;align-items:center;gap:0;height:90px}
.bell i{display:block;border-radius:6px;background:linear-gradient(180deg,var(--e1),var(--e2));opacity:0;transform:scale(.2)}
.bell .p1{width:14px;height:80px;animation:pop .5s .1s forwards}.bell .p2{width:14px;height:56px;margin-left:5px;animation:pop .5s .25s forwards}
.bell .bar{width:0;height:12px;background:linear-gradient(90deg,var(--gold),#fff,var(--gold));margin-left:5px;opacity:1;transform:none;animation:grow .6s .5s forwards}
.bell .p3{width:14px;height:56px;margin-left:5px;animation:pop .5s .9s forwards}.bell .p4{width:14px;height:80px;margin-left:5px;animation:pop .5s 1.05s forwards}
.sp-title{font-family:var(--fh);font-weight:800;font-size:34px;letter-spacing:8px;display:flex;overflow:hidden;position:relative}
.sp-title span{display:inline-block;transform:translateY(110%);animation:rise .6s forwards}
.sp-sub{font-size:11px;letter-spacing:6px;color:var(--mute);opacity:0;animation:fade .8s 1.5s forwards}
.sp-bar{width:140px;height:3px;border-radius:3px;background:var(--s2);overflow:hidden;position:relative}
.sp-bar:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--e1),var(--e2));transform:translateX(-100%);animation:load 2.3s .2s forwards}
@keyframes pop{to{opacity:1;transform:scale(1)}}@keyframes grow{to{width:62px}}@keyframes rise{to{transform:none}}@keyframes fade{to{opacity:1}}@keyframes load{to{transform:none}}@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}
/* layout */
.app{max-width:440px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom))}
.view{display:none}.view.on{display:block;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
header.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 22px;app-region:drag;-webkit-app-region:drag}
@media (display-mode:window-controls-overlay){header.top{padding-top:calc(env(titlebar-area-height,0px) + 4px)}}
.logo{font-size:24px;font-weight:800;letter-spacing:3px}
.icon-btn{width:44px;height:44px;border-radius:14px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;-webkit-app-region:no-drag}
.icon-btn svg{width:20px;height:20px;stroke:var(--tx);fill:none;stroke-width:2;stroke-linecap:round}
.hello{color:var(--mute);font-size:13px;font-weight:600}
.hero{position:relative;border-radius:22px;padding:22px;margin:6px 0 16px;border:1px solid rgba(var(--ac),.3);background:linear-gradient(145deg,rgba(var(--ac),.16),var(--s1) 60%);overflow:hidden;box-shadow:0 20px 50px -20px rgba(var(--ac2),.4)}
.hero small{color:var(--gold);font-weight:700;letter-spacing:2px;font-size:11px}
.hero h2{font-size:28px;margin:8px 0 4px}.hero p{margin:0 0 18px;color:var(--mute);font-size:14px}
.btn{width:100%;border:0;border-radius:14px;padding:16px;font-family:var(--fh);font-weight:800;font-size:14px;letter-spacing:1.5px;text-transform:uppercase;color:var(--onac);background:linear-gradient(135deg,var(--e1),var(--e2));box-shadow:0 10px 26px -8px rgba(var(--ac2),.6)}
.btn:active{transform:scale(.98)}.btn.ghost{background:var(--s2);color:var(--tx);box-shadow:none;border:1px solid var(--line)}.btn.ok{background:linear-gradient(135deg,#6dffb8,var(--ok))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.stat b{display:block;font-family:var(--fh);font-size:22px}.stat span{font-size:10px;letter-spacing:1.5px;color:var(--mute);font-weight:700}
.sec{font-size:12px;letter-spacing:3px;margin:0 0 12px;font-weight:800}
.week{display:flex;flex-direction:column;gap:10px}
.day{display:flex;align-items:center;justify-content:space-between;padding:15px 16px;border-radius:16px;background:var(--s1);border:1px solid var(--line);cursor:pointer}
.day:active{background:var(--s2)}.day.today{border-color:rgba(var(--ac),.55)}
.day h3{font-size:14px;letter-spacing:1px}.day p{margin:3px 0 0;font-size:12px;color:var(--mute);font-weight:600}
.day.done p{color:var(--ok)}.tag{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--e1)}
.chev{color:var(--mute);font-size:18px}
/* drawer */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);opacity:0;visibility:hidden;transition:.25s;z-index:900}
.ov.on{opacity:1;visibility:visible}
.drawer{position:fixed;top:0;right:-340px;width:min(330px,88vw);height:100%;background:var(--drawer);border-left:1px solid var(--line);z-index:1000;transition:right .3s cubic-bezier(.2,.8,.2,1);padding:calc(22px + env(safe-area-inset-top)) 18px 24px;overflow-y:auto}
.drawer.on{right:0}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.dh h2{font-size:22px;font-weight:800}
.box{margin-bottom:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);overflow:hidden}
.box>button{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;padding:16px;font-family:var(--fh);font-weight:700;font-size:14px;text-align:left}
.box>button b{font-size:18px;color:var(--e1);transition:transform .2s}
.box.open>button b{transform:rotate(90deg)}
.sub{display:none;padding:0 16px 16px}.box.open .sub{display:block}
.sub h4{margin:14px 0 6px;font-size:12px;font-weight:700;color:var(--gold);letter-spacing:1px}
.sub p,.sub label{font-size:13px;color:var(--mute);line-height:1.5}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal div{aspect-ratio:1;display:grid;place-items:center;font-size:11px;border-radius:8px;border:1px solid var(--line);font-weight:700}
.cal .h{border:0;color:var(--mute);aspect-ratio:auto}.cal .l{background:rgba(var(--okrgb),.14);border-color:var(--ok);color:var(--ok)}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.kv:last-child{border:0}.kv b{font-family:var(--fh)}
select,textarea{width:100%;background:var(--s2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:11px;font-family:inherit;font-size:14px}
textarea{min-height:110px;resize:vertical}
.mini{margin-top:10px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--s2);font-weight:700;font-size:13px}
/* workout */
.rh{display:flex;align-items:center;gap:14px;margin-bottom:20px}.rh h2{font-size:22px;font-weight:800}
.meta{display:grid;grid-template-columns:repeat(3,1fr);background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:22px;gap:6px}
.meta span{display:block;font-size:10px;letter-spacing:1.5px;color:var(--mute);font-weight:700}.meta b{font-family:var(--fh);font-size:13px}.meta .f{color:var(--e1)}
.ex{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:16px}
.ex h4{font-family:var(--fh);margin:2px 0 4px;font-size:15px}.ex p{margin:0 0 12px;font-size:13px;color:var(--mute);font-weight:600}.ex p span{color:var(--e1)}
.vid{height:210px;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line)}.vid video{width:100%;height:100%;object-fit:cover}
.hud{display:none}
.hcard{border:1px solid rgba(var(--ac),.4);border-radius:20px;padding:18px;text-align:center;background:linear-gradient(160deg,rgba(var(--ac),.1),var(--s1));margin-bottom:16px}
.hcard h3{font-size:20px;margin:6px 0}.hcard .sc{color:var(--e1);font-weight:800;font-size:13px;letter-spacing:1px;margin-bottom:12px}
.dots{display:flex;justify-content:center;gap:6px;margin-bottom:12px}.dots i{width:22px;height:5px;border-radius:3px;background:var(--s2)}.dots i.on{background:var(--ok)}.dots i.cur{background:var(--e1)}
.prog{height:4px;background:var(--s2);border-radius:4px;margin:0 0 16px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--e1),var(--e2));width:0;transition:width .3s}
.clock{background:var(--s1);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center;margin-bottom:16px}
.clock small{font-size:10px;letter-spacing:2px;color:var(--mute);font-weight:700}.clock .t{font-family:var(--fh);font-weight:800;font-size:54px}.clock .t.crit{color:var(--e2);animation:pulse .5s infinite alternate}
.elapsed{font-size:12px;color:var(--mute);text-align:center;margin-bottom:12px;font-weight:700;letter-spacing:1px}
.toast{position:fixed;left:50%;bottom:30px;transform:translate(-50%,30px);background:var(--s2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:.3s;z-index:2000;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}

html[data-theme=royal]{--bg:#070914;--s1:#0e1020;--s2:#161931;--e1:#8b7bff;--e2:#5b3df5;--gold:#7de3ff;--ac:139,123,255;--ac2:91,61,245;--onac:#0a0620;--g1:#fff;--g2:#c9c1ff;--g3:#7de3ff;--drawer:linear-gradient(180deg,#101326,#080a16)}
html[data-theme=gold]{--bg:#0a0a0b;--s1:#131314;--s2:#1c1c1e;--e1:#f0c35a;--e2:#b8841a;--gold:#ffe3a0;--ac:240,195,90;--ac2:184,132,26;--onac:#1a1100;--g1:#fff4d6;--g2:#f0c35a;--g3:#c68a1d;--drawer:linear-gradient(180deg,#141413,#08080a)}
html[data-theme=emerald]{--bg:#060b0b;--s1:#0c1514;--s2:#12201f;--e1:#3ee6b0;--e2:#0f9d7a;--gold:#9ff5d8;--ok:#8ef0a0;--okrgb:142,240,160;--ac:62,230,176;--ac2:15,157,122;--onac:#00160f;--g1:#fff;--g2:#9ff5d8;--g3:#3ee6b0;--drawer:linear-gradient(180deg,#0c1716,#060c0b)}
html[data-theme=crimson]{--bg:#0b0607;--s1:#150c0e;--s2:#201317;--e1:#ff4d6d;--e2:#c9184a;--gold:#ffb3c1;--ac:255,77,109;--ac2:201,24,74;--onac:#1c0207;--g1:#fff;--g2:#ffb3c1;--g3:#ff4d6d;--drawer:linear-gradient(180deg,#180d10,#0a0506)}
html[data-theme=platinum]{--bg:#f4f2ed;--s1:#ffffff;--s2:#ebe8e1;--line:rgba(0,0,0,.09);--tx:#17161a;--mute:#6c6975;--e1:#c98a2b;--e2:#8a4b00;--gold:#9a6a1c;--ok:#14925e;--okrgb:20,146,94;--ac:201,138,43;--ac2:138,75,0;--onac:#ffffff;--g1:#17161a;--g2:#7a4a0f;--g3:#c98a2b;--drawer:linear-gradient(180deg,#ffffff,#efece5);color-scheme:light}
.grad{background:linear-gradient(110deg,var(--g1) 0%,var(--g2) 30%,var(--g3) 55%,var(--g2) 80%,var(--g1) 100%);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 12px rgba(var(--ac),.45));animation:sheen 7s linear infinite}
@keyframes sheen{to{background-position:220% center}}
.sec::after{content:"";display:block;width:38px;height:3px;margin-top:9px;border-radius:3px;background:linear-gradient(90deg,var(--e1),var(--e2));box-shadow:0 0 12px rgba(var(--ac),.7)}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tbtn{display:flex;align-items:center;gap:8px;padding:10px;border-radius:10px;background:var(--s2);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--tx);text-align:left}
.tbtn i{width:18px;height:18px;border-radius:50%;flex:0 0 auto}
.tbtn.on{border-color:var(--e1);box-shadow:0 0 0 1px var(--e1)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 14px;border-radius:12px;background:var(--s1);border:1px solid var(--line);font-size:12px;font-weight:800;letter-spacing:1px;text-decoration:none;color:var(--mute)}
.chip.on{color:var(--onac);background:linear-gradient(135deg,var(--e1),var(--e2));border-color:transparent}
.chip.done:not(.on){color:var(--ok);border-color:var(--ok)}
a.btn{display:block;text-align:center;text-decoration:none}
</style>
</head>
<body>
<div class="app">
  <div class="rh">
    <a class="icon-btn" href="index.html" id="back" aria-label="Back home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div><h2 id="wt" class="grad">Workout</h2><div class="hello" id="sub"></div></div>
  </div>
  <nav class="chips" id="chips"></nav>
  <div class="meta"><div><span>TIME</span><b>~45 MIN</b></div><div><span>REST</span><b id="mr">60 SEC</b></div><div><span>SPLIT</span><b class="f" id="mf"></b></div></div>

  <div id="over">
    <div id="vault"></div>
    <button class="btn" id="start">Start Workout</button>
  </div>

  <div class="hud" id="hud">
    <div class="elapsed" id="el">TIME 00:00</div>
    <div class="prog"><i id="pg"></i></div>
    <div class="hcard">
      <div class="dots" id="dots"></div>
      <h3 id="hn"></h3>
      <div class="sc" id="hs"></div>
      <div class="vid"><video id="hv" autoplay loop muted playsinline></video></div>
    </div>
    <div class="clock"><small id="cs">COMPLETE YOUR SET</small><div class="t" id="ct">--</div></div>
    <button class="btn" id="act">Set Done &middot; Start Rest</button>
    <button class="btn ghost" id="quit" style="margin-top:12px">End Workout</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id),U='https://files.catbox.moe/';
const mv=(n,s,t,v)=>({n,s,t,v:U+v+'.mp4'});
const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const chest=[mv('Dumbbell Floor Press','15 Reps',4,'kp27ib'),mv('Standard Push-ups','12 Reps',4,'s2rqzi'),mv('Decline Push-ups','10 Reps',3,'nwoem7'),mv('Overhead Dumbbell Tricep Extension','12 Reps',4,'hrpwyd'),mv('Chair or Bench Dips','15 Reps',3,'i4ql6k'),mv('Diamond Push-ups','To Failure',3,'g99k8u')];
const shoulder=[mv('Dumbbell Shoulder Press','12 Reps',4,'699d62'),mv('Dumbbell Lateral Raises','15 Reps',4,'2zncg6'),mv('Dumbbell Rear Delt Flyes','15 Reps',4,'9v5xjd'),mv('Dumbbell Bicep Curls','12 Reps',4,'7a2mai'),mv('Dumbbell Hammer Curls','12 Reps',4,'td39uz'),mv('Pike Push-ups','8-10 Reps',3,'db3ut5')];
const BANK={Monday:{f:'Chest & Triceps',m:chest},Tuesday:{f:'Shoulder & Bicep',m:shoulder},
Wednesday:{f:'Legs',m:[mv('Dumbbell Goblet Squats','15 Reps',4,'mce4ys'),mv('Dumbbell Bulgarian Split Squats','12 Reps (Per Leg)',3,'hrx0yt'),mv('Dumbbell Romanian Deadlifts','15 Reps',4,'m58qpu'),mv('Walking Lunges','20 Total Steps',3,'5eb9n4'),mv('Calf Raises','20 Reps',4,'ro3u86')]},
Thursday:{f:'Abs (Core)',m:[mv('Plank Shoulder Taps','45 Seconds',4,'kf5a81'),mv('Bicycle Crunches','20 Reps',3,'1wtf9l'),mv('Lying Leg Raises','15 Reps',3,'e2va8y'),mv('Russian Twists','20 Total Reps',3,'e5rdnf'),mv('Flutter Kicks','45 Seconds',3,'e2va8y')]},
Friday:{f:'Chest & Triceps',m:chest},Saturday:{f:'Shoulder & Bicep',m:shoulder},Sunday:{f:'Rest Day',m:[]}};

const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const key=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const cfg=()=>Object.assign({rest:60,alert:'on'},ld('ironTimeSettings',{}));
const dayName=d=>DAYS[(d.getDay()+6)%7];
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}

function getDay(){let d=new URLSearchParams(location.search).get('day')||'today';d=d.trim();
  if(d.toLowerCase()==='today')return dayName(new Date());
  d=d.charAt(0).toUpperCase()+d.slice(1).toLowerCase();return BANK[d]?d:dayName(new Date())}

const day=getDay(),moves=BANK[day].m;
let ei=0,si=1,tm=null,clk=null,rem=60,t0=0,resting=false,finished=false;

/* header + day chips */
$('wt').textContent=day+' Routine';$('mf').textContent=BANK[day].f;$('mr').textContent=cfg().rest+' SEC';
$('sub').textContent=moves.length?moves.length+' exercises':'Recovery day';
document.title='IRON TIME - '+day;try{const m=document.querySelector('meta[name=theme-color]');m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()}catch(e){}
const L=ld('ironTimeLogs',{}),mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
$('chips').innerHTML=DAYS.map((n,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);
  return `<a class="chip ${n===day?'on':''} ${L[key(d)]?'done':''}" href="workout.html?day=${n}">${n.slice(0,3).toUpperCase()}</a>`}).join('');

/* overview list */
$('vault').innerHTML=moves.length
 ?moves.map(m=>`<div class="ex"><h4>${m.n}</h4><p>Target: <span>${m.t} x ${m.s}</span></p><div class="vid"><video autoplay loop muted playsinline preload="metadata" src="${m.v}"></video></div></div>`).join('')
 :'<div class="hero"><h2 class="grad">Full Recovery</h2><p>Rest, stretch, hydrate and sleep. Muscles grow while you recover.</p></div><a class="btn" href="index.html">Back to Week</a>';
if(!moves.length)$('start').style.display='none';

/* live workout */
function beep(){if(cfg().alert!=='on')return;try{navigator.vibrate&&navigator.vibrate(200);const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>o.stop(),150)}catch(e){}}
function stopAll(){clearInterval(tm);clearInterval(clk);tm=clk=null;resting=false}
$('start').onclick=()=>{$('over').style.display='none';$('hud').style.display='block';t0=Date.now();
  clk=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1e3);$('el').textContent='TIME '+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1e3);render()};
function render(){const m=moves[ei];resting=false;clearInterval(tm);tm=null;
  $('hn').textContent=m.n;$('hs').textContent=`SET ${si} OF ${m.t} — ${m.s}`;
  $('dots').innerHTML=Array.from({length:m.t},(_,i)=>`<i class="${i<si-1?'on':i===si-1?'cur':''}"></i>`).join('');
  const tot=moves.reduce((a,x)=>a+x.t,0),dn=moves.slice(0,ei).reduce((a,x)=>a+x.t,0)+si-1;$('pg').style.width=(dn/tot*100)+'%';
  $('hv').src=m.v;$('hv').play().catch(()=>{});
  $('cs').textContent='COMPLETE YOUR SET';$('ct').textContent='--';$('ct').classList.remove('crit');
  $('act').innerHTML='Set Done &middot; Start Rest';$('act').className='btn'}
function next(){clearInterval(tm);tm=null;const m=moves[ei];
  if(si<m.t){si++;render()}else if(ei<moves.length-1){ei++;si=1;render()}
  else{clearInterval(clk);resting=false;finished=true;$('pg').style.width='100%';$('cs').textContent='WORKOUT COMPLETE';$('ct').textContent='DONE';$('ct').classList.remove('crit');$('act').textContent='Finish & Save';$('act').className='btn ok';beep()}}
$('act').onclick=()=>{
  if(finished){const l=ld('ironTimeLogs',{});l[key(new Date())]='completed';sv('ironTimeLogs',l);stopAll();location.href='index.html';return}
  if(!resting){
    if(ei===moves.length-1&&si===moves[ei].t){return next()}
    resting=true;rem=cfg().rest;$('cs').textContent='RESTING';$('ct').textContent=rem+'s';$('act').textContent='Skip Rest';$('act').className='btn ghost';
    tm=setInterval(()=>{rem--;$('ct').textContent=rem+'s';$('ct').classList.toggle('crit',rem<=3);if(rem<=0){beep();next()}},1e3)}
  else next()};
$('quit').onclick=()=>{if(confirm('End this workout without saving?')){stopAll();location.href='index.html'}};

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
