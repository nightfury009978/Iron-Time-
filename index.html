<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IronTime | Booting...</title>
    <style>
        body {
            background: #000;
            color: #ff6b00;
            font-family: 'Courier New', monospace;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* The Glitch Container */
        .glitch-wrapper {
            text-align: center;
            width: 80%;
        }

        .glitch-text {
            font-size: 1.2rem;
            font-weight: bold;
            position: relative;
            display: inline-block;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: glitch-anim 0.2s infinite;
        }

        /* Intensified Glitch Effect */
        @keyframes glitch-anim {
            0% { transform: translate(0); text-shadow: -2px 0 red, 2px 0 blue; }
            25% { transform: translate(-2px, 2px); text-shadow: 2px 0 red, -2px 0 blue; }
            50% { transform: translate(2px, -2px); text-shadow: -2px 0 blue, 2px 0 red; }
            75% { transform: translate(-2px, -2px); text-shadow: 2px 0 blue, -2px 0 red; }
            100% { transform: translate(0); }
        }

        .quote-box {
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
            min-height: 50px;
            line-height: 1.5;
        }

        /* Loading Bar for that System feel */
        .loading-bar {
            width: 150px;
            height: 2px;
            background: #111;
            margin-top: 30px;
            position: relative;
            overflow: hidden;
        }
        .loading-bar::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 2px;
            background: #ff6b00;
            animation: loading 1.5s infinite;
        }
        @keyframes loading {
            0% { left: -50px; }
            100% { left: 150px; }
        }
    </style>
</head>
<body>

    <div class="glitch-wrapper">
        <div class="glitch-text">SYSTEM_AUTHORIZING...</div>
        <div class="quote-box" id="quote-text"></div>
        <div class="loading-bar"></div>
    </div>

    <script>
        const quotes = [
            "THE ONLY LIMIT IS THE ONE YOU BUILD.",
            "PAIN IS WEAKNESS LEAVING THE BODY.",
            "DISCIPLINE > MOTIVATION.",
            "DO TODAY WHAT OTHERS WON'T.",
            "STAY HUNGRY. STAY HUMBLE.",
            "YOUR BODY IS A PROJECT. WORK ON IT."
        ];

        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                document.getElementById("quote-text").innerHTML = text.substring(0, i+1) + '<span aria-hidden="true">|</span>';
                setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback)
                }, 50);
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 1500);
            }
        }

        window.onload = function() {
            // Logic for "Same Quote All Day"
            const today = new Date().toDateString();
            let dailyQuote = localStorage.getItem('iron_daily_quote');
            let lastDate = localStorage.getItem('iron_quote_date');

            if (lastDate !== today) {
                dailyQuote = quotes[Math.floor(Math.random() * quotes.length)];
                localStorage.setItem('iron_daily_quote', dailyQuote);
                localStorage.setItem('iron_quote_date', today);
            }

            // Start the typewriter effect
            setTimeout(() => {
                typeWriter(dailyQuote, 0, function() {
                    // This is where we will trigger the next step later
                    console.log("Glitch and Quote finished.");
                });
            }, 1000);
        };
    </script>
</body>
</html>
