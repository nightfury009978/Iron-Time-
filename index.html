<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IronTime</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 1. Intro Styles */
        #intro-layer {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff6b00;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .loader-bar {
            width: 200px;
            height: 3px;
            background: #1a1a1a;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }

        .loader-fill {
            position: absolute;
            width: 0%;
            height: 100%;
            background: #ff6b00;
            box-shadow: 0 0 10px #ff6b00;
            animation: loadProgress 2.5s ease-in-out forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }

        /* 2. Setup Screen Styles */
        #setup-layer, #main-layer { display: none; width: 85%; max-width: 400px; text-align: center; }
        
        .input-box { margin: 20px 0; text-align: left; }
        label { color: #666; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; }
        input, select {
            width: 100%; padding: 15px; background: #111; border: 1px solid #333;
            color: #fff; border-radius: 10px; margin-top: 5px; box-sizing: border-box;
        }

        .btn-orange {
            width: 100%; padding: 20px; background: #ff6b00; color: #000;
            border: none; border-radius: 12px; font-weight: bold; font-size: 1rem;
            text-transform: uppercase; margin-top: 20px;
        }

        /* 3. Main Menu Styles */
        .stat-badge { font-size: 0.7rem; color: #ff6b00; border: 1px solid #ff6b00; padding: 5px 10px; border-radius: 5px; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>

    <div id="intro-layer">
        <div class="logo">IRONTIME</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <div id="setup-layer">
        <h2 style="color:#ff6b00; margin-bottom: 30px;">INITIALIZE PROFILE</h2>
        <div class="input-box">
            <label>Height (cm)</label>
            <input type="number" id="h-input" placeholder="180">
        </div>
        <div class="input-box">
            <label>Weight (kg)</label>
            <input type="number" id="w-input" placeholder="75">
        </div>
        <div class="input-box">
            <label>Equipment Access</label>
            <select id="e-input">
                <option value="Bodyweight">No Equipment (Home)</option>
                <option value="Dumbbells">Dumbbells Only</option>
                <option value="Gym">Full Gym</option>
            </select>
        </div>
        <button class="btn-orange" onclick="saveProfile()">ACTIVATE SYSTEM</button>
    </div>

    <div id="main-layer">
        <div class="logo" style="font-size: 2rem;">IRONTIME</div>
        <div id="user-display" class="stat-badge"></div>
        
        <button class="btn-orange" style="background:#111; color:#fff; border:1px solid #333;" onclick="start('Beginner')">Beginner</button>
        <button class="btn-orange" style="background:#111; color:#fff; border:1px solid #333;" onclick="start('Mid')">Mid-Tier</button>
        <button class="btn-orange" onclick="start('Pro')">PRO MODE</button>
        
        <p style="color:#333; margin-top: 40px; font-size: 0.7rem;" onclick="resetSystem()">RESET SYSTEM DATA</p>
    </div>

    <script>
        window.onload = function() {
            // After 2.5s (duration of the loader animation)
            setTimeout(() => {
                document.getElementById('intro-layer').style.display = 'none';
                
                // Check if user has already set up
                if (localStorage.getItem('iron_setup_done')) {
                    showMain();
                } else {
                    document.getElementById('setup-layer').style.display = 'block';
                }
            }, 2600);
        };

        function saveProfile() {
            const h = document.getElementById('h-input').value;
            const w = document.getElementById('w-input').value;
            const e = document.getElementById('e-input').value;

            if(!h || !w) return alert("Please enter your stats.");

            localStorage.setItem('iron_h', h);
            localStorage.setItem('iron_w', w);
            localStorage.setItem('iron_e', e);
            localStorage.setItem('iron_setup_done', 'true');
            showMain();
        }

        function showMain() {
            document.getElementById('setup-layer').style.display = 'none';
            document.getElementById('main-layer').style.display = 'block';
            
            const weight = localStorage.getItem('iron_w');
            const equip = localStorage.getItem('iron_e');
            document.getElementById('user-display').innerText = `${weight}KG | ${equip.toUpperCase()}`;
        }

        function start(level) {
            localStorage.setItem('workoutLevel', level);
            window.location.href = 'workout.html';
        }

        function resetSystem() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
