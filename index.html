<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON TIME - Dashboard</title>
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
        }

        /* Top Bar Layout */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .app-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1.5px;
            color: #ffffff;
            margin: 0;
        }

        .app-title span {
            color: #FF5500;
        }

        /* Menu Button (3-lines) */
        .menu-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            transition: color 0.2s ease;
        }

        .menu-btn:active {
            color: #FF5500;
        }

        .section-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            color: #666666;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
            font-weight: 700;
        }

        /* Day Selector Grid */
        .days-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Animated Edge-Light Button Wrapper */
        .day-card-wrapper {
            position: relative;
            border-radius: 10px;
            padding: 1px; /* Creates the border width */
            background: #161616;
            overflow: hidden;
            cursor: pointer;
        }

        /* Moving Neon Light Effect */
        .day-card-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(
                transparent, 
                transparent, 
                #FF5500, 
                transparent, 
                transparent
            );
            animation: rotateEdge 4s linear infinite;
            z-index: 1;
        }

        @keyframes rotateEdge {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Inner Button Content */
        .day-card-inner {
            position: relative;
            background: #050505;
            border-radius: 9px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            width: 100%;
            border: none;
            color: #ffffff;
            text-align: left;
            font-family: 'Rajdhani', sans-serif;
            cursor: pointer;
        }

        .day-info h3 {
            font-family: 'Orbitron', sans-serif;
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .day-info p {
            margin: 0;
            font-size: 13px;
            color: #888888;
            font-weight: 600;
        }

        .go-icon {
            color: #FF5500;
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .day-card-wrapper:active .go-icon {
            transform: translateX(3px);
        }

        /* Progress Drawer Panel (Slides in from the right) */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .progress-drawer {
            position: absolute;
            top: 0;
            right: -320px;
            width: 320px;
            height: 100%;
            background: #050505;
            border-left: 1px solid #161616;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            transition: right 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
        }

        .drawer-overlay.open .progress-drawer {
            right: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .drawer-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 800;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #666666;
            font-size: 20px;
            cursor: pointer;
        }

        /* Calendar Styling */
        .calendar-month-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: #FF5500;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            text-align: center;
        }

        .cal-header {
            font-size: 11px;
            font-weight: 700;
            color: #444444;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .cal-day {
            background: #111111;
            border: 1px solid #1a1a1a;
            border-radius: 6px;
            height: 38px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #ffffff; /* Default: White for future or pending days */
            position: relative;
        }

        /* Calendar Tracking States */
        .cal-day.completed {
            background: #001a08;
            border-color: #00ff55;
            color: #00ff55; /* Neon Green Success */
            text-shadow: 0 0 5px rgba(0, 255, 85, 0.5);
        }

        .cal-day.missed {
            background: #1a0000;
            border-color: #550000;
            color: #ff3333;
        }

        .cal-day .status-emoji {
            font-size: 9px;
            margin-top: 1px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- TOP APP BAR -->
        <div class="top-bar">
            <h1 class="app-title">IRON<span>TIME</span></h1>
            <button class="menu-btn" onclick="toggleDrawer(true)"><i class="fa-solid fa-bars"></i></button>
        </div>

        <div class="section-label">Select Training Day</div>

        <!-- EDGE-LIT TRAINING DAYS GRID -->
        <div class="days-grid">
            
            <div class="day-card-wrapper" onclick="launchWorkout('Monday')">
                <div class="day-card-inner">
                    <div class="day-info">
                        <h3>Monday</h3>
                        <p>Chest & Triceps Focus</p>
                    </div>
                    <i class="fa-solid fa-chevron-right go-icon"></i>
                </div>
            </div>

            <div class="day-card-wrapper" onclick="launchWorkout('Tuesday')">
                <div class="day-card-inner">
                    <div class="day-info">
                        <h3>Tuesday</h3>
                        <p>Shoulder & Bicep Focus</p>
                    </div>
                    <i class="fa-solid fa-chevron-right go-icon"></i>
                </div>
            </div>

            <div class="day-card-wrapper" onclick="launchWorkout('Wednesday')">
                <div class="day-card-inner">
                    <div class="day-info">
                        <h3>Wednesday</h3>
                        <p>Legs Focus</p>
                    </div>
                    <i class="fa-solid fa-chevron-right go-icon"></i>
                </div>
            </div>

            <div class="day-card-wrapper" onclick="launchWorkout('Thursday')">
                <div class="day-card-inner">
                    <div class="day-info">
                        <h3>Thursday</h3>
                        <p>Abs (Core) Focus</p>
                    </div>
                    <i class="fa-solid fa-chevron-right go-icon"></i>
                </div>
            </div>

            <div class="day-card-wrapper" onclick="launchWorkout('Friday')">
                <div class="day-card-inner">
                    <div class="day-info">
                        <h3>Friday</h3>
                        <p>Chest & Triceps Focus</p>
                    </div>
                    <i class="fa-solid fa-chevron-right go-icon"></i>
                </div>
            </div>

            <div class="day-card-wrapper" onclick="launchWorkout('Saturday')">
                <div class="day-card-inner">
                    <div class="day-info">
                        <h3>Saturday</h3>
                        <p>Shoulder & Bicep Focus</p>
                    </div>
                    <i class="fa-solid fa-chevron-right go-icon"></i>
                </div>
            </div>

            <div class="day-card-wrapper" onclick="launchWorkout('Sunday')">
                <div class="day-card-inner">
                    <div class="day-info">
                        <h3>Sunday</h3>
                        <p>Rest & Recovery</p>
                    </div>
                    <i class="fa-solid fa-chevron-right go-icon"></i>
                </div>
            </div>

        </div>
    </div>

    <!-- SIDE DRAWER OVERLAY -->
    <div id="drawer-overlay" class="drawer-overlay" onclick="closeOverlay(event)">
        <div class="progress-drawer">
            <div class="drawer-header">
                <h2>Progress Hub</h2>
                <button class="close-btn" onclick="toggleDrawer(false)"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="month-title" class="calendar-month-title">Loading Month...</div>
            
            <!-- CALENDAR STRUCTURE -->
            <div class="calendar-grid" id="calendar-matrix">
                <!-- Day titles -->
                <div class="cal-header">S</div><div class="cal-header">M</div><div class="cal-header">T</div>
                <div class="cal-header">W</div><div class="cal-header">T</div><div class="cal-header">F</div>
                <div class="cal-header">S</div>
                <!-- Dynamic grid dates will inject here -->
            </div>
        </div>
    </div>

    <script>
        function launchWorkout(dayName) {
            window.location.href = `workout.html?day=${dayName}`;
        }

        function toggleDrawer(open) {
            const overlay = document.getElementById('drawer-overlay');
            if(open) {
                buildAutomatedCalendar();
                overlay.classList.add('open');
            } else {
                overlay.classList.remove('open');
            }
        }

        function closeOverlay(e) {
            if(e.target.id === 'drawer-overlay') {
                toggleDrawer(false);
            }
        }

        // Generate automated calendar matching tracking conditions
        function buildAutomatedCalendar() {
            const matrix = document.getElementById('calendar-matrix');
            const titleBox = document.getElementById('month-title');
            
            // Clean up old active values keeping headers intact
            const headers = matrix.querySelectorAll('.cal-header');
            matrix.innerHTML = '';
            headers.forEach(h => matrix.appendChild(h));

            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth(); // 0-indexed
            const todayDate = now.getDate();
            const currentHour = now.getHours();

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            titleBox.innerText = `${monthNames[month]} ${year}`;

            // Calculations for rendering calendar matrix frames
            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            // Pull tracking log data parsed from storage keys: "YYYY-MM-DD"
            const logDatabase = JSON.parse(localStorage.getItem('ironTimeLogs') || '{}');

            // Inject spacer blocks for offsetting weekday beginnings
            for(let i = 0; i < firstDayIndex; i++) {
                const blank = document.createElement('div');
                matrix.appendChild(blank);
            }

            // Generate active dynamic dates
            for(let d = 1; d <= totalDays; d++) {
                const dateCell = document.createElement('div');
                dateCell.classList.add('cal-day');
                dateCell.innerText = d;

                // Format key fingerprint
                const monthString = String(month + 1).padStart(2, '0');
                const dayString = String(d).padStart(2, '0');
                const dateKey = `${year}-${monthString}-${dayString}`;

                if (logDatabase[dateKey] === 'completed') {
                    // Rule: Done inside validation timeline turns Neon Green
                    dateCell.classList.add('completed');
                } else if (d < todayDate) {
                    // Rule: Missed past day deadlines default to failure emoji status 
                    dateCell.classList.add('missed');
                    dateCell.innerHTML += `<span class="status-emoji">❌</span>`;
                } else if (d === todayDate) {
                    // Rule: Checking today's threshold parameters relative to midnight (12am)
                    if (currentHour >= 0) { 
                        // If workout not done yet and it's past 12am today, show ❌
                        dateCell.classList.add('missed');
                        dateCell.innerHTML += `<span class="status-emoji">❌</span>`;
                    } else {
                        // Yet to do / within time window -> Clean white prose formatting
                        dateCell.style.color = '#ffffff';
                    }
                } else {
                    // Future validation points maintain basic white profile status
                    dateCell.style.color = '#ffffff';
                }

                matrix.appendChild(dateCell);
            }
        }
    </script>
</body>
</html>
