<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IronTime</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* INTRO LAYER */
        #intro-layer {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff6b00;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .loader-bar {
            width: 200px;
            height: 4px;
            background: #222;
            border-radius: 10px;
            overflow: hidden;
        }

        .loader-fill {
            width: 0%;
            height: 100%;
            background: #ff6b00;
            box-shadow: 0 0 15px #ff6b00;
            animation: loadProgress 2s linear forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* CONTENT LAYERS */
        #setup-layer, #main-layer { 
            display: none; 
            width: 85%; 
            max-width: 400px; 
            text-align: center; 
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .input-box { margin: 20px 0; text-align: left; }
        label { color: #666; font-size: 0.8rem; text-transform: uppercase; }
        
        input, select {
            width: 100%; padding: 15px; background: #111; border: 1px solid #333;
            color: #fff; border-radius: 10px; margin-top: 5px; box-sizing: border-box;
            font-size: 1rem;
        }

        .btn-orange {
            width: 100%; padding: 20px; background: #ff6b00; color: #000;
            border: none; border-radius: 12px; font-weight: bold; font-size: 1rem;
            text-transform: uppercase; margin-top: 20px;
        }

        .stat-badge { font-size: 0.7rem; color: #ff6b00; border: 1px solid #ff6b00; padding: 5px 10px; border-radius: 5px; margin-bottom: 20px; display: inline-block; }
    </style>
</head>
<body>

    <div id="intro-layer">
        <div class="logo">IRONTIME</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <div id="setup-layer">
        <h2 style="color:#ff6b00;">INITIALIZE</h2>
        <div class="input-box">
            <label>Height (cm)</label>
            <input type="number" id="h-input" placeholder="180">
        </div>
        <div class="input-box">
            <label>Weight (kg)</label>
            <input type="number" id="w-input" placeholder="75">
        </div>
        <div class="input-box">
            <label>Equipment</label>
            <select id="e-input">
                <option value="Bodyweight">Home (No Equipment)</option>
                <option value="Dumbbells">Home (Dumbbells)</option>
                <option value="Gym">Full Gym</option>
            </select>
        </div>
        <button class="btn-orange" onclick="saveProfile()">ACTIVATE</button>
    </div>

    <div id="main-layer">
        <div class="logo" style="font-size: 2.2rem;">IRONTIME</div>
        <div id="user-display" class="stat-badge"></div>
        <button class="btn-orange" style="background:#111; color:#fff; border:1px solid #333;" onclick="start('Beginner')">Beginner</button>
        <button class="btn-orange" style="background:#111; color:#fff; border:1px solid #333;" onclick="start('Mid')">Mid-Tier</button>
        <button class="btn-orange" onclick="start('Pro')">PRO MODE</button>
        <p style="color:#222; margin-top: 40px; font-size: 0.6rem;" onclick="resetSystem()">[RESET SYSTEM]</p>
    </div>

    <script>
        // Force the transition after 2.2 seconds
        setTimeout(function() {
            document.getElementById('intro-layer').style.display = 'none';
            
            if (localStorage.getItem('iron_setup_done')) {
                showMain();
            } else {
                document.getElementById('setup-layer').style.display = 'block';
            }
        }, 2200);

        function saveProfile() {
            const h = document.getElementById('h-input').value;
            const w = document.getElementById('w-input').value;
            const e = document.getElementById('e-input').value;

            if(!h || !w) {
                alert("Enter your stats, athlete.");
                return;
            }

            localStorage.setItem('iron_h', h);
            localStorage.setItem('iron_w', w);
            localStorage.setItem('iron_e', e);
            localStorage.setItem('iron_setup_done', 'true');
            showMain();
        }

        function showMain() {
            document.getElementById('setup-layer').style.display = 'none';
            document.getElementById('main-layer').style.display = 'block';
            
            const weight = localStorage.getItem('iron_w') || '0';
            const equip = localStorage.getItem('iron_e') || 'NONE';
            document.getElementById('user-display').innerText = `${weight}KG | ${equip.toUpperCase()}`;
        }

        function start(level) {
            localStorage.setItem('workoutLevel', level);
            window.location.href = 'workout.html';
        }

        function resetSystem() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
