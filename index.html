<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON TIME</title>
    <!-- Fonts and Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
        }

        /* ----------------------------------
           INTERFACE 1: LOADING SCREEN
        ---------------------------------- */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #loading-screen h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 3px;
            margin: 0 0 30px 0;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 85, 0, 0.3);
        }

        #loading-screen h1 span {
            color: #FF5500;
            text-shadow: 0 0 15px rgba(255, 85, 0, 0.6);
        }

        /* Round Loading Symbol */
        .loader-circle {
            width: 50px;
            height: 50px;
            border: 4px solid #111111;
            border-top: 4px solid #FF5500;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-shadow: 0 0 10px rgba(255, 85, 0, 0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ----------------------------------
           INTERFACE 2: MAIN DASHBOARD
        ---------------------------------- */
        #dashboard-panel {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            display: none;
            padding-top: 20px;
        }

        #dashboard-panel.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 35px;
            border-bottom: 1px solid #151515;
            padding-bottom: 20px;
        }

        .brand-header h2 {
            font-family: 'Orbitron', sans-serif;
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .brand-header h2 span {
            color: #FF5500;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            color: #666666;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            padding-left: 2px;
        }

        .days-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 40px;
        }

        /* Day Buttons with Custom Edge Lighting */
        .day-btn {
            background: #050505;
            border: 1px solid #161616;
            border-radius: 10px;
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: background 0.2s ease;
        }

        /* Accent edge lighting highlights for active taps */
        .day-btn:active {
            background: #111111;
            border-color: #FF5500;
            box-shadow: 0 0 12px rgba(255, 85, 0, 0.2);
        }

        /* Specific Edge Lighting Border Highlight for Today (Saturday Highlight Template) */
        .day-btn.today-highlight {
            border-color: #FF5500;
            box-shadow: inset 0 0 8px rgba(255, 85, 0, 0.15), 0 0 15px rgba(255, 85, 0, 0.25);
            background: #0a0401;
        }

        .day-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .day-split {
            font-size: 13px;
            color: #FF5500;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-btn.today-highlight .day-split {
            color: #ffffff;
            background: #FF5500;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <!-- INTERFACE 1: LOADING SCREEN -->
    <div id="loading-screen">
        <h1>IRON <span>TIME</span></h1>
        <div class="loader-circle"></div>
    </div>

    <!-- INTERFACE 2: MAIN DASHBOARD CONTAINER -->
    <div class="app-container">
        <div id="dashboard-panel">
            
            <div class="brand-header">
                <h2>IRON <span>TIME</span></h2>
            </div>
            
            <div class="section-title">Select Training Day</div>
            
            <div class="days-grid">
                <!-- Monday -->
                <div class="day-btn" onclick="navigateToWorkout('Monday')">
                    <span class="day-name">Monday</span>
                    <span class="day-split">Chest & Triceps</span>
                </div>
                
                <!-- Tuesday -->
                <div class="day-btn" onclick="navigateToWorkout('Tuesday')">
                    <span class="day-name">Tuesday</span>
                    <span class="day-split">Shoulder & Bicep</span>
                </div>
                
                <!-- Wednesday -->
                <div class="day-btn" onclick="navigateToWorkout('Wednesday')">
                    <span class="day-name">Wednesday</span>
                    <span class="day-split">Legs</span>
                </div>
                
                <!-- Thursday -->
                <div class="day-btn" onclick="navigateToWorkout('Thursday')">
                    <span class="day-name">Thursday</span>
                    <span class="day-split">Abs (Core)</span>
                </div>
                
                <!-- Friday -->
                <div class="day-btn" onclick="navigateToWorkout('Friday')">
                    <span class="day-name">Friday</span>
                    <span class="day-split">Chest & Triceps</span>
                </div>
                
                <!-- Saturday (Highlighted with Edge Lighting as requested) -->
                <div class="day-btn today-highlight" onclick="navigateToWorkout('Saturday')">
                    <span class="day-name">Saturday</span>
                    <span class="day-split">Shoulder & Bicep</span>
                </div>
                
                <!-- Sunday -->
                <div class="day-btn" onclick="navigateToWorkout('Sunday')">
                    <span class="day-name">Sunday</span>
                    <span class="day-split">Rest & Recovery</span>
                </div>
            </div>

        </div>
    </div>

    <script>
        // Handle Interface 1 to Interface 2 transition automatically
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                const dashboard = document.getElementById('dashboard-panel');
                
                // Fade out loader
                loader.style.opacity = '0';
                loader.style.visibility = 'hidden';
                
                // Show dashboard panel smoothly
                dashboard.style.display = 'block';
                setTimeout(() => {
                    dashboard.classList.add('active');
                }, 50);
            }, 2000); // Loads for exactly 2 seconds
        });

        // Redirects to your separate workout file, passing the day selected
        function navigateToWorkout(dayName) {
            window.location.href = `workout.html?day=${dayName}`;
        }
    </script>
</body>
</html>
