<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON TIME</title>
    <!-- Fonts & Icon Assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&family=Rajdhani:wght=600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Fluid SPA Interface Screens */
        .app-view {
            display: none;
            width: 100%;
            min-height: 100vh;
            justify-content: center;
            align-items: flex-start;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }

        .app-view.active {
            display: flex;
            opacity: 1;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            position: relative;
        }

        /* Top Bar Layout */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            margin-bottom: 30px;
        }

        .menu-btn {
            font-size: 22px;
            color: #ffffff;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #ffffff;
            margin: 0;
        }

        .logo-title span {
            color: #FF5500;
        }

        /* Tactical Weekly Grid System */
        .week-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 20px;
        }

        .day-panel {
            background-color: #050505;
            border: 1px solid #161616;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.15s, background-color 0.15s;
        }

        .day-panel:active {
            background-color: #0a0a0a;
            border-color: #FF5500;
        }

        .day-meta h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            margin: 0 0 4px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .day-meta p {
            margin: 0;
            font-size: 13px;
            color: #666666;
            font-weight: 700;
            text-transform: uppercase;
        }

        .day-panel.completed .day-meta p {
            color: #00ff55;
        }

        .action-arrow {
            color: #333333;
            font-size: 14px;
            transition: color 0.15s;
        }

        .day-panel:active .action-arrow {
            color: #FF5500;
        }

        /* Tactical Drawer Terminal */
        .side-drawer {
            position: fixed;
            top: 0;
            left: -320px;
            width: 320px;
            height: 100%;
            background-color: #050505;
            border-right: 1px solid #161616;
            z-index: 1000;
            transition: left 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
            padding: 30px 24px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .side-drawer.open {
            left: 0;
        }

        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(3px);
            z-index: 999;
            display: none;
        }

        .drawer-overlay.visible {
            display: block;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .drawer-header h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        .close-drawer-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
        }

        .calendar-month-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            font-weight: 700;
            color: #FF5500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 15px 0;
        }

        /* Drawer Nav Elements */
        .drawer-nav-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex-grow: 1;
        }

        .drawer-link {
            font-family: 'Orbitron', sans-serif;
            background: #0d0d0d;
            border: 1px solid #1a1a1a;
            color: #ffffff;
            padding: 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .drawer-link i {
            color: #FF5500;
            font-size: 14px;
        }

        .drawer-link:active {
            border-color: #FF5500;
            background-color: #111111;
        }

        .logout-link {
            font-family: 'Orbitron', sans-serif;
            background: none;
            border: none;
            color: #444444;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 700;
            text-align: left;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logout-link:active {
            color: #ff3333;
        }

        /* Sub-Interface Frameworks (Calendar Panel) */
        .sub-panel {
            display: none;
            background-color: transparent;
            padding: 5px 0;
            margin-top: 5px;
        }

        .sub-panel.active {
            display: block;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-header-day {
            text-align: center;
            font-size: 11px;
            color: #777777;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            padding-bottom: 5px;
        }

        .calendar-day-node {
            aspect-ratio: 1;
            background-color: transparent;
            border: 1px solid #222222;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
        }

        .calendar-day-node.logged {
            background-color: rgba(0, 255, 85, 0.05);
            border-color: #00ff55;
            color: #00ff55;
            text-shadow: 0 0 10px rgba(0, 255, 85, 0.3);
        }

        /* --- WORKOUT VIEW STYLES --- */
        .routine-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .back-btn {
            font-size: 18px;
            color: #FF5500;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
        }

        .meta-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background-color: #050505;
            border: 1px solid #161616;
            padding: 14px 10px;
            border-radius: 8px;
            margin-bottom: 30px;
            gap: 5px;
            font-family: 'Orbitron', sans-serif;
        }

        .meta-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-size: 11px;
            letter-spacing: 0.5px;
        }

        .meta-label { 
            color: #666666; 
            font-weight: 700; 
            text-transform: uppercase; 
            display: flex; 
            align-items: center; 
            gap: 4px; 
        }

        .meta-label i { color: #FF5500; font-size: 11px; }
        .meta-value { color: #ffffff; font-weight: 800; text-transform: uppercase; font-size: 12px; }
        #target-focus-value { color: #FF5500; }

        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-bottom: 40px;
        }

        .exercise-card {
            background-color: #050505;
            border: 1px solid #161616;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .ex-info h4 {
            font-family: 'Orbitron', sans-serif;
            margin: 0 0 6px 0;
            font-size: 16px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ex-info p { margin: 0; font-size: 14px; color: #aaaaaa; font-weight: 700; }
        .ex-info p span { color: #FF5500; font-family: 'Orbitron', sans-serif; font-size: 13px; }

        .workout-gif-window {
            width: 100%;
            height: 220px;
            background-color: #111111;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #222222;
        }

        .workout-gif-window video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            background-color: #000000;
        }

        #active-workout-hud {
            display: none; 
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
        }

        .hud-card {
            background-color: #050505;
            border: 1px solid #FF5500;
            box-shadow: 0 0 15px rgba(255, 85, 0, 0.05);
            width: 100%;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .hud-exercise-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin: 0 0 10px 0;
        }

        .hud-set-metrics {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            color: #FF5500;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }

        .timer-module {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 10px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .timer-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            color: #666666;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 42px;
            font-weight: 900;
            color: #ffffff;
        }

        .timer-display.critical {
            color: #FF5500;
            font-size: 64px;
            animation: criticalBlink 0.5s ease-in-out infinite alternate;
        }

        @keyframes criticalBlink {
            0% { transform: scale(1); opacity: 1; text-shadow: 0 0 20px rgba(255, 85, 0, 0.6); }
            100% { transform: scale(1.1); opacity: 0.6; text-shadow: 0 0 5px rgba(255, 85, 0, 0.1); }
        }

        .primary-btn {
            font-family: 'Orbitron', sans-serif;
            width: 100%;
            padding: 16px;
            background-color: #FF5500;
            color: #000000;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(255, 85, 0, 0.2);
            margin-bottom: 20px;
        }

        .primary-btn:active {
            transform: scale(0.98);
            background-color: #e04b00;
        }

        .primary-btn.complete-mode {
            background-color: #00ff55;
            color: #000000;
            box-shadow: 0 4px 15px rgba(0, 255, 85, 0.3);
            text-shadow: none;
        }
    </style>
</head>
<body>

    <!-- OVERLAY SHADOW LAYER -->
    <div id="app-overlay" class="drawer-overlay" onclick="closeSideMenu()"></div>

    <!-- TACTICAL SIDE DRAWER -->
    <nav id="app-drawer" class="side-drawer">
        <div class="drawer-header">
            <h2>Progress Hub</h2>
            <button class="close-drawer-btn" onclick="closeSideMenu()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="drawer-nav-container">
            <!-- Progress Chart Button Trigger -->
            <button class="drawer-link" onclick="toggleProgressHubPanel()">
                <span>Progress Chart</span>
                <i id="hub-chevron" class="fa-solid fa-chevron-down"></i>
            </button>
            
            <!-- Hidden Calendar Mesh Area -->
            <div id="progress-hub-panel" class="sub-panel">
                <div id="calendar-month-header" class="calendar-month-title">JULY 2026</div>
                <div class="calendar-grid" id="drawer-calendar-mesh"></div>
            </div>
        </div>

        <!-- Logout Action Placeholder -->
        <button class="logout-link" onclick="handleSecureLogoffProcess()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
        </button>
    </nav>


    <!-- ========================================== -->
    <!-- VIEW 1: HOME PLATFORM INTERFACE            -->
    <!-- ========================================== -->
    <main id="view-home" class="app-view active">
        <div class="app-container">
            <header class="top-navbar">
                <button class="menu-btn" onclick="openSideMenu()"><i class="fa-solid fa-bars-strikethrough"></i></button>
                <h1 class="logo-title">IRON<span>TIME</span></h1>
                <div style="width:32px;"></div> <!-- Alignment Counterweight -->
            </header>

            <section class="week-grid" id="main-week-matrix"></section>
        </div>
    </main>


    <!-- ========================================== -->
    <!-- VIEW 2: WORKOUT MODULE INTERFACE          -->
    <!-- ========================================== -->
    <main id="view-workout" class="app-view">
        <div class="app-container">
            <div class="routine-header">
                <button class="back-btn" onclick="switchActiveView('view-home')"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 id="day-title-header">Workout Plan</h2>
            </div>

            <div class="meta-container">
                <div class="meta-box">
                    <span class="meta-label"><i class="fa-solid fa-clock"></i> TIME:</span>
                    <span class="meta-value">~45 MIN</span>
                </div>
                <div class="meta-box">
                    <span class="meta-label"><i class="fa-solid fa-stopwatch"></i> REST:</span>
                    <span class="meta-value">60 SEC</span>
                </div>
                <div class="meta-box">
                    <span class="meta-label"><i class="fa-solid fa-dumbbell"></i> SPLIT:</span>
                    <span id="target-focus-value" class="meta-value">LOADING</span>
                </div>
            </div>

            <!-- List Mode Overview -->
            <div id="overview-zone">
                <div id="workout-vault" class="exercise-list"></div>
                <button class="primary-btn" onclick="startInteractiveWorkout()">Start Workout</button>
            </div>

            <!-- Interactive Live HUD -->
            <div id="active-workout-hud">
                <div class="hud-card">
                    <h3 id="hud-exercise-name" class="hud-exercise-title">EXERCISE NAME</h3>
                    <div id="hud-set-counter" class="hud-set-metrics">SET 1 OF 4 — 15 REPS</div>
                    
                    <div class="workout-gif-window">
                        <video id="hud-video-display" autoplay loop muted playsinline>
                            <source id="hud-video-source" type="video/mp4">
                        </video>
                    </div>
                </div>

                <div class="timer-module" onclick="triggerRestTimer()">
                    <div id="timer-status-text" class="timer-label">Tap to start rest interval</div>
                    <div id="countdown-clock" class="timer-display">60s</div>
                </div>

                <button id="hud-action-btn" class="primary-btn" onclick="skipOrAdvanceSet()">Skip Timer</button>
            </div>
        </div>
    </main>


    <!-- ========================================== -->
    <!-- APPLICATION CORE CONTROLLER JAVASCRIPT     -->
    <!-- ========================================== -->

        let currentExerciseIndex = 0;
        let currentSetIndex = 1;
        let countdownRunning = null;
        let remainingSeconds = 60;
        let chosenDay = "Monday";
        let trackingMovesList = [];

        // Smooth SPA Screen Switcher Engine
        function switchActiveView(viewId) {
            document.querySelectorAll('.app-view').forEach(view => {
                view.classList.remove('active');
            });
            const activeView = document.getElementById(viewId);
            activeView.classList.add('active');
            
            if (viewId === 'view-home') {
                compileWeeklyStatusDashboard();
            }
        }

        // Drawer Menu Controllers
        function openSideMenu() {
            document.getElementById('app-drawer').classList.add('open');
            document.getElementById('app-overlay').classList.add('visible');
            buildSecureCalendarMatrix();
        }

        function closeSideMenu() {
            document.getElementById('app-drawer').classList.remove('open');
            document.getElementById('app-overlay').classList.remove('visible');
            
            // Collapse accordion smoothly upon menu close
            document.getElementById('progress-hub-panel').classList.remove('active');
            document.getElementById('hub-chevron').className = "fa-solid fa-chevron-down";
        }

        function toggleProgressHubPanel() {
            const panel = document.getElementById('progress-hub-panel');
            const chevron = document.getElementById('hub-chevron');
            
            panel.classList.toggle('active');
            if (panel.classList.contains('active')) {
                chevron.className = "fa-solid fa-chevron-up";
            } else {
                chevron.className = "fa-solid fa-chevron-down";
            }
        }

        function handleSecureLogoffProcess() {
            alert("Configuration terminal placeholder.");
        }

        // Render Home Screen List Interface
        function compileWeeklyStatusDashboard() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const dayStr = String(now.getDate()).padStart(2, '0');
            const dateKey = `${year}-${month}-${dayStr}`;

            const logDatabase = JSON.parse(localStorage.getItem('ironTimeLogs') || '{}');
            const mainMatrix = document.getElementById('main-week-matrix');
            mainMatrix.innerHTML = '';

            const weekDays = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
            
            weekDays.forEach(day => {
                let statusLabel = exerciseDataBank[day].focus;
                let completionClass = "";

                if (logDatabase[dateKey] && new Date().toLocaleDateString('en-US', {weekday: 'long'}) === day) {
                    statusLabel = "COMPLETED TODAY";
                    completionClass = "completed";
                }

                const dayCardHTML = `
                    <div class="day-panel ${completionClass}" onclick="loadWorkoutInterface('${day}')">
                        <div class="day-meta">
                            <h3>${day}</h3>
                            <p>${statusLabel}</p>
                        </div>
                        <div class="action-arrow"><i class="fa-solid fa-chevron-right"></i></div>
                    </div>
                `;
                mainMatrix.insertAdjacentHTML('beforeend', dayCardHTML);
            });
        }

        // Build Progress Calendar Panel 
        function buildSecureCalendarMatrix() {
            const calendarGrid = document.getElementById('drawer-calendar-mesh');
            calendarGrid.innerHTML = '';

            const headers = ["S", "M", "T", "W", "T", "F", "S"];
            headers.forEach(h => {
                calendarGrid.insertAdjacentHTML('beforeend', `<div class="calendar-header-day">${h}</div>`);
            });

            const current = new Date();
            const year = current.getFullYear();
            const month = current.getMonth(); // 0-indexed month

            // Set Month header text automatically (e.g., "JULY 2026")
            const monthNames = ["JANUARY", "FEBRUARY", "MARCH", "APRIL", "MAY", "JUNE", "JULY", "AUGUST", "SEPTEMBER", "OCTOBER", "NOVEMBER", "DECEMBER"];
            document.getElementById('calendar-month-header').innerText = `${monthNames[month]} ${year}`;

            const logDatabase = JSON.parse(localStorage.getItem('ironTimeLogs') || '{}');
            
            // Find total days in current month and first day offset
            const totalDaysInMonth = new Date(year, month + 1, 0).getDate();
            const firstDayIndex = new Date(year, month, 1).getDay(); // Sunday=0, Monday=1, etc.

            // Render padding blanks for empty spaces before day 1
            for (let i = 0; i < firstDayIndex; i++) {
                calendarGrid.insertAdjacentHTML('beforeend', `<div class="calendar-day-node" style="border:none; visibility:hidden;"></div>`);
            }

            // Populate days dynamically
            for (let d = 1; d <= totalDaysInMonth; d++) {
                const dayString = String(d).padStart(2, '0');
                const monthString = String(month + 1).padStart(2, '0');
                const loopKey = `${year}-${monthString}-${dayString}`;

                let loggedClass = logDatabase[loopKey] ? 'logged' : '';
                calendarGrid.insertAdjacentHTML('beforeend', `<div class="calendar-day-node ${loggedClass}">${d}</div>`);
            }
        }

        // Setup Selected Workout Routine Data
        function loadWorkoutInterface(dayName) {
            chosenDay = dayName;
            const targetData = exerciseDataBank[chosenDay];
            trackingMovesList = targetData.moves;

            currentExerciseIndex = 0;
            currentSetIndex = 1;

            document.getElementById('day-title-header').innerText = `${chosenDay} Routine`;
            document.getElementById('target-focus-value').innerText = targetData.focus;

            document.getElementById('overview-zone').style.display = 'block';
            document.getElementById('active-workout-hud').style.display = 'none';

            const targetVault = document.getElementById('workout-vault');
            targetVault.innerHTML = '';

            trackingMovesList.forEach(move => {
                const isVideo = move.img.toLowerCase().endsWith('.mp4');
                const mediaTag = isVideo 
                    ? `<video autoplay loop muted playsinline><source src="${move.img}" type="video/mp4"></video>`
                    : `<img src="${move.img}" alt="${move.name}">`;

                const itemHTML = `
                    <div class="exercise-card">
                        <div class="ex-info">
                            <h4>${move.name}</h4>
                            <p>Target Sets: <span>${move.sets} sets x ${move.stats}</span></p>
                        </div>
                        <div class="workout-gif-window">
                            ${mediaTag}
                        </div>
                    </div>
                `;
                targetVault.insertAdjacentHTML('beforeend', itemHTML);
            });

            switchActiveView('view-workout');
        }

        function startInteractiveWorkout() {
            document.getElementById('overview-zone').style.display = 'none';
            document.getElementById('active-workout-hud').style.display = 'flex';
            renderHudExercise();
        }

        function renderHudExercise() {
            const currentMove = trackingMovesList[currentExerciseIndex];
            
            document.getElementById('hud-exercise-name').innerText = currentMove.name;
            document.getElementById('hud-set-counter').innerText = `SET ${currentSetIndex} OF ${currentMove.sets} — ${currentMove.stats}`;
            
            const videoDisplay = document.getElementById('hud-video-display');
            const videoSource = document.getElementById('hud-video-source');
            
            videoDisplay.setAttribute('muted', '');
            videoDisplay.setAttribute('playsinline', '');
            videoDisplay.setAttribute('loop', '');
            videoDisplay.muted = true;
            
            videoSource.src = currentMove.img;
            videoDisplay.load();
            
            let playPromise = videoDisplay.play();
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    document.body.addEventListener('click', () => {
                        videoDisplay.play();
                    }, { once: true });
                });
            }

            clearInterval(countdownRunning);
            countdownRunning = null;
            remainingSeconds = 60;
            
            const displayClock = document.getElementById('countdown-clock');
            displayClock.innerText = "60s";
            displayClock.classList.remove('critical');
            document.getElementById('timer-status-text').innerText = "Tap to start rest interval";
            
            const actionBtn = document.getElementById('hud-action-btn');
            actionBtn.innerText = "Skip Timer";
            actionBtn.className = "primary-btn";
            actionBtn.onclick = skipOrAdvanceSet;
        }

        function triggerRestTimer() {
            if (countdownRunning !== null) return;

            document.getElementById('timer-status-text').innerText = "REST INTERVAL ACTIVE";
            const displayClock = document.getElementById('countdown-clock');

            countdownRunning = setInterval(() => {
                remainingSeconds--;
                displayClock.innerText = `${remainingSeconds}s`;

                if (remainingSeconds <= 3 && remainingSeconds > 0) {
                    displayClock.classList.add('critical');
                }

                if (remainingSeconds <= 0) {
                    clearInterval(countdownRunning);
                    countdownRunning = null;
                    advanceToNextSegment();
                }
            }, 1000);
        }

        function skipOrAdvanceSet() {
            if (countdownRunning !== null) {
                clearInterval(countdownRunning);
                countdownRunning = null;
            }
            advanceToNextSegment();
        }

        function advanceToNextSegment() {
            const currentMove = trackingMovesList[currentExerciseIndex];

            if (currentSetIndex < currentMove.sets) {
                currentSetIndex++;
                renderHudExercise();
            } else if (currentExerciseIndex < trackingMovesList.length - 1) {
                currentExerciseIndex++;
                currentSetIndex = 1;
                renderHudExercise();
            } else {
                displayWorkoutCompletionTrigger();
            }
        }

        function displayWorkoutCompletionTrigger() {
            const statusText = document.getElementById('timer-status-text');
            const clockScreen = document.getElementById('countdown-clock');
            const actionBtn = document.getElementById('hud-action-btn');

            statusText.innerText = "ROUTINE COMPLETED VECTORS ACHIEVED";
            clockScreen.innerText = "DONE";
            clockScreen.classList.remove('critical');

            actionBtn.innerText = "COMPLETE";
            actionBtn.classList.add('complete-mode');
            actionBtn.onclick = commitVerificationLogToMemory;
        }

        function commitVerificationLogToMemory() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const dayStr = String(now.getDate()).padStart(2, '0');
            const dateKey = `${year}-${month}-${dayStr}`;

            const logDatabase = JSON.parse(localStorage.getItem('ironTimeLogs') || '{}');
            logDatabase[dateKey] = 'completed';
            localStorage.setItem('ironTimeLogs', JSON.stringify(logDatabase));

            // Force immediate silent background grid rebuild
            buildSecureCalendarMatrix();

            switchActiveView('view-home');
        }

        window.onload = function() {
            compileWeeklyStatusDashboard();
        };
    </script>
</body>
