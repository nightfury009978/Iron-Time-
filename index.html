<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IronTime | Level Select</title>
    <style>
        /* Cinematic Dark Theme */
        body {
            background-color: #050505;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 6px;
            color: #ff6b00;
            text-shadow: 0 0 20px rgba(255, 107, 0, 0.4);
            margin: 0;
        }

        .subtitle {
            color: #666;
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .level-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background: #111;
            border: 1px solid #333;
            color: white;
            padding: 22px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s ease;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            transform: scale(0.96);
            background: #1a1a1a;
            border-color: #ff6b00;
        }

        /* Pro Button Highlight */
        .btn-pro {
            border: 1.5px solid #ff0000;
            color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.1);
        }

        .btn-pro:active {
            background: rgba(255, 0, 0, 0.1);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
    </style>
</head>
<body>

    <h1 class="logo">IRONTIME</h1>
    <p class="subtitle">Personal Training OS</p>

    <div class="level-container">
        <button class="btn" onclick="selectLevel('Beginner')">Beginner</button>
        <button class="btn" onclick="selectLevel('Mid')">Mid-Tier</button>
        <button class="btn btn-pro" onclick="selectLevel('Pro')">Pro Mode</button>
    </div>

    <script>
        function selectLevel(level) {
    // Save the level so the next page knows what to show
    localStorage.setItem('workoutLevel', level);
    
    // This is the magic line that switches screens
    window.location.href = 'workout.html';
        }
    </script>

</body>
</html>
