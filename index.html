<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IronTime OS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #000;
            color: #fff;
            font-family: sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* INTRO LAYER */
        #intro-layer {
            position: absolute;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            color: #ff6b00;
            letter-spacing: 5px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .loader-bar {
            width: 250px;
            height: 6px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .loader-fill {
            width: 0%;
            height: 100%;
            background: #ff6b00;
            box-shadow: 0 0 15px #ff6b00;
            animation: loadProgress 2s linear forwards;
        }

        @keyframes loadProgress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        /* CONTENT LAYERS */
        #setup-layer, #main-layer { 
            display: none; 
            width: 85%; 
            max-width: 400px; 
            text-align: center;
        }

        .input-box { margin: 15px 0; text-align: left; }
        label { color: #888; font-size: 0.7rem; text-transform: uppercase; display: block; margin-bottom: 5px; }
        
        input, select {
            width: 100%; padding: 18px; background: #111; border: 1px solid #333;
            color: #fff; border-radius: 12px; font-size: 1rem; outline: none;
        }

        .btn-orange {
            width: 100%; padding: 22px; background: #ff6b00; color: #000;
            border: none; border-radius: 15px; font-weight: bold; font-size: 1.1rem;
            text-transform: uppercase; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div id="intro-layer">
        <div class="logo">IRONTIME</div>
        <div class="loader-bar"><div class="loader-fill"></div></div>
    </div>

    <div id="setup-layer">
        <h2 style="color:#ff6b00; margin-bottom: 30px;">PROFILE SETUP</h2>
        <div class="input-box">
            <label>Height (cm)</label>
            <input type="number" id="h-input" placeholder="e.g. 175">
        </div>
        <div class="input-box">
            <label>Weight (kg)</label>
            <input type="number" id="w-input" placeholder="e.g. 70">
        </div>
        <div class="input-box">
            <label>Your Equipment</label>
            <select id="e-input">
                <option value="Bodyweight">No Equipment</option>
                <option value="Dumbbells">Dumbbells</option>
                <option value="Gym">Full Gym</option>
            </select>
        </div>
        <button class="btn-orange" onclick="saveProfile()">ACTIVATE SYSTEM</button>
    </div>

    <div id="main-layer">
        <div class="logo" style="font-size: 2rem;">IRONTIME</div>
        <div id="user-display" style="color:#ff6b00; font-weight:bold; margin-bottom: 20px;"></div>
        <button class="btn-orange" style="background:#111; color:#fff; border:1px solid #444;" onclick="start('Beginner')">Beginner</button>
        <button class="btn-orange" style="background:#111; color:#fff; border:1px solid #444;" onclick="start('Mid')">Mid-Tier</button>
        <button class="btn-orange" onclick="start('Pro')">PRO MODE</button>
        <p style="color:#222; margin-top: 50px;" onclick="localStorage.clear(); location.reload();">RESET SYSTEM</p>
    </div>

    <script>
        // MAIN BOOT SEQUENCE
        setTimeout(function() {
            document.getElementById('intro-layer').style.display = 'none';
            
            // Logic to see if user is new
            if (localStorage.getItem('iron_setup_done') === 'true') {
                showMain();
            } else {
                document.getElementById('setup-layer').style.display = 'block';
            }
        }, 2200);

        function saveProfile() {
            const h = document.getElementById('h-input').value;
            const w = document.getElementById('w-input').value;
            const e = document.getElementById('e-input').value;

            if(!h || !w) return alert("Fill out the specs, athlete.");

            localStorage.setItem('iron_h', h);
            localStorage.setItem('iron_w', w);
            localStorage.setItem('iron_e', e);
            localStorage.setItem('iron_setup_done', 'true');
            showMain();
        }

        function showMain() {
            document.getElementById('setup-layer').style.display = 'none';
            document.getElementById('main-layer').style.display = 'block';
            
            const w = localStorage.getItem('iron_w');
            const e = localStorage.getItem('iron_e');
            document.getElementById('user-display').innerText = `${w}KG | ${e.toUpperCase()}`;
        }

        function start(level) {
            localStorage.setItem('workoutLevel', level);
            window.location.href = 'workout.html';
        }
    </script>
</body>
</html>
