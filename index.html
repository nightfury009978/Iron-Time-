<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IronTime | Initialization</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-direction: column;
        }

        /* Container to center everything */
        .intro-container {
            position: relative;
            width: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* The Logo (Initial State) */
        #logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff6b00;
            letter-spacing: 5px;
            opacity: 1;
            position: absolute; /* Keep it centered while quote loads */
            transition: opacity 0.5s ease;
        }

        /* Shatter Animation Simulation */
        .shatter {
            animation: shatter-sim 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes shatter-sim {
            0% { transform: scale(1); opacity: 1; filter: blur(0px); }
            30% { transform: scale(1.1) rotate(1deg); filter: blur(1px); }
            100% { transform: scale(2); opacity: 0; filter: blur(10px); }
        }

        /* The Quote Area */
        #quote-text {
            color: #ccc;
            font-size: 1.1rem;
            line-height: 1.5;
            text-align: center;
            font-weight: 300;
            min-height: 3em; /* Reserve space so layout doesn't jump */
            opacity: 0; /* Hidden initially */
            transition: opacity 1s ease 0.6s; /* Fade in AFTER shatter */
        }

        /* Temporary display for main UI */
        #main-ui-placeholder {
            display: none;
            color: #ff6b00;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink { 0% {opacity: 1} 50% {opacity: 0} 100% {opacity: 1} }

    </style>
</head>
