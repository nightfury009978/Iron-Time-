<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRONTIME</title>
    <style>
        /* --- GENERAL STYLES --- */
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Utility class to hide screens */
        .hidden {
            display: none !important;
        }

        /* --- INTERFACE 1: LOADING SCREEN --- */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .brand-title {
            color: #FF5500; /* Your IronTime Orange */
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }

        /* Simple CSS Spinner matching your screenshot */
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 85, 0, 0.1);
            border-top-color: #FF5500;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- INTERFACE 2: ONBOARDING SCREEN --- */
        .onboarding-container {
            width: 100%;
            max-width: 360px;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            color: #FF5500;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #bbb;
        }

        input[type="number"], textarea {
            width: 100%;
            padding: 14px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus, textarea:focus {
            border-color: #FF5500;
            outline: none;
        }

        .radio-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .loc-btn {
            flex: 1;
            padding: 15px;
            background-color: #111;
            border: 2px solid #333;
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: 0.3s;
        }

        .loc-btn.active {
            border-color: #FF5500;
            color: #FF5500;
            background-color: rgba(255, 85, 0, 0.1);
        }

        .primary-btn {
            width: 100%;
            padding: 15px;
            background-color: #FF5500;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="screen-loading" class="loading-screen">
        <div class="brand-title">IRONTIME</div>
        <div class="spinner"></div>
    </div>


    <div id="screen-onboarding" class="onboarding-container hidden">
        <h2>Tell us about yourself</h2>
        
        <div class="input-group">
            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="e.g. 70">
        </div>
        
        <div class="input-group">
            <label for="height">Height (cm)</label>
            <input type="number" id="height" placeholder="e.g. 175">
        </div>

        <div class="input-group">
            <label>Where do you train?</label>
            <div class="radio-buttons">
                <button type="button" class="loc-btn" id="btn-gym" onclick="selectLocation('gym')">Gym</button>
                <button type="button" class="loc-btn" id="btn-home" onclick="selectLocation('home')">Home</button>
            </div>
        </div>

        <div id="home-equipment-box" class="input-group hidden">
            <label for="equipment">List your equipment:</label>
            <textarea id="equipment" rows="3" placeholder="e.g. Dumbbells, Resistance bands, Pull-up bar..."></textarea>
        </div>

        <button id="next-btn" class="primary-btn" onclick="goToThirdInterface()">Continue</button>
    </div>


    <script>
        // 1. SIMULATE LOADING SCREEN TRANSITION
        // This automatically hides the loading screen and shows the onboarding after 3 seconds
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.getElementById('screen-loading').classList.add('hidden');
                document.getElementById('screen-onboarding').classList.remove('hidden');
            }, 3000); // 3000 milliseconds = 3 seconds
        });

        // 2. LOCATION HANDLING
        let selectedLocation = '';

        function selectLocation(type) {
            selectedLocation = type;
            
            // Toggle active classes on buttons
            document.getElementById('btn-gym').classList.remove('active');
            document.getElementById('btn-home').classList.remove('active');
            document.getElementById(`btn-${type}`).classList.add('active');
            
            // Show/Hide equipment box based on selection
            const equipmentBox = document.getElementById('home-equipment-box');
            if (type === 'home') {
                equipmentBox.classList.remove('hidden');
            } else {
                equipmentBox.classList.add('hidden');
            }
        }

        // 3. TRANSITION TO INTERFACE 3
        function goToThirdInterface() {
            const weight = document.getElementById('weight').value;
            const height = document.getElementById('height').value;
            
            if (!weight || !height || !selectedLocation) {
                alert("Please fill out your height, weight, and select a training location!");
                return;
            }
            
            if (selectedLocation === 'home') {
                const equipment = document.getElementById('equipment').value;
                alert(`Data Saved!\nWeight: ${weight}kg\nHeight: ${height}cm\nType: Home\nEquipment: ${equipment}\n\nReady for Interface 3!`);
            } else {
                alert(`Data Saved!\nWeight: ${weight}kg\nHeight: ${height}cm\nType: Gym\n\nReady for Interface 3!`);
            }
        }
    </script>
</body>
</html>
