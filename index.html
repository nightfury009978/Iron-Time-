<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRON TIME</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght=700;900&family=Rajdhani:wght=600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000000; color: #ffffff; font-family: 'Rajdhani', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }

        /* FIXED: SOLID SPLASH SCREEN OVERLAY */
        #loading-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100vh;
            background-color: #000000;
            z-index: 10000; /* Forces it to stay on top */
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 20px;
            opacity: 1; transition: opacity 0.3s ease;
        }
        #loading-splash.hidden { opacity: 0; pointer-events: none; }
        .splash-title { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900; letter-spacing: 2px; color: #ffffff; margin: 0; }
        .splash-title span { color: #FF5500; }
        .spinner-circle { width: 40px; height: 40px; border: 3px solid rgba(255, 85, 0, 0.1); border-radius: 50%; border-top-color: #FF5500; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* SPA SCREEN CONTROL */
        .app-view { display: none; width: 100%; min-height: 100vh; justify-content: center; opacity: 0; transition: opacity 0.2s ease; }
        .app-view.active { display: flex; opacity: 1; }
        .app-container { width: 100%; max-width: 420px; padding: 20px; }

        /* NAVBAR */
        .top-navbar { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 30px 0; }
        .menu-btn { font-size: 22px; color: #ffffff; background: none; border: none; cursor: pointer; padding: 5px; }
        .logo-title { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 2px; margin: 0; }
        .logo-title span { color: #FF5500; }

        /* WEEK GRID */
        .week-grid { display: flex; flex-direction: column; gap: 14px; }
        .day-panel { background-color: #050505; border: 1px solid #161616; border-radius: 8px; padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .day-panel:active { border-color: #FF5500; background-color: #0a0a0a; }
        .day-meta h3 { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 700; margin: 0 0 4px 0; text-transform: uppercase; }
        .day-meta p { margin: 0; font-size: 13px; color: #666666; font-weight: 700; text-transform: uppercase; }
        .day-panel.completed .day-meta p { color: #00ff55; }
        .action-arrow { color: #333333; font-size: 14px; }

        /* DRAWER TERMINAL */
        .side-drawer { position: fixed; top: 0; left: -320px; width: 320px; height: 100%; background-color: #050505; border-right: 1px solid #161616; z-index: 2000; transition: left 0.2s ease; padding: 30px 24px; display: flex; flex-direction: column; }
        .side-drawer.open { left: 0; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(0, 0, 0, 0.7); backdrop-filter: blur(3px); z-index: 1999; display: none; }
        .drawer-overlay.visible { display: block; }
        .drawer-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .drawer-header h2 { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; margin: 0; }
        .close-drawer-btn { background: none; border: none; color: #ffffff; font-size: 20px; }
        .drawer-link { font-family: 'Orbitron', sans-serif; background: #0d0d0d; border: 1px solid #1a1a1a; color: #ffffff; padding: 16px; border-radius: 6px; font-size: 14px; font-weight: 700; width: 100%; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .sub-panel { display: none; margin-top: 10px; }
        .sub-panel.active { display: block; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .calendar-header-day { text-align: center; font-size: 11px; color: #777777; font-weight: 700; font-family: 'Orbitron', sans-serif; }
        .calendar-day-node { aspect-ratio: 1; border: 1px solid #222222; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 12px; color: #ffffff; }
        .calendar-day-node.logged { border-color: #00ff55; color: #00ff55; background-color: rgba(0, 255, 85, 0.05); }

        /* WORKOUT VIEW */
        .routine-header { display: flex; align-items: center; gap: 15px; margin: 10px 0 25px 0; }
        .back-btn { font-size: 18px; color: #FF5500; background: none; border: none; }
        .meta-container { display: grid; grid-template-columns: repeat(3, 1fr); background-color: #050505; border: 1px solid #161616; padding: 14px 10px; border-radius: 8px; margin-bottom: 30px; font-family: 'Orbitron', sans-serif; font-size: 11px; }
        .meta-box { display: flex; flex-direction: column; gap: 4px; }
        .meta-label { color: #666666; font-weight: 700; }
        .meta-value { color: #ffffff; font-weight: 800; }
        #target-focus-value { color: #FF5500; }
        .exercise-list { display: flex; flex-direction: column; gap: 24px; margin-bottom: 40px; }
        .exercise-card { background-color: #050505; border: 1px solid #161616; border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 15px; }
        .ex-info h4 { font-family: 'Orbitron', sans-serif; margin: 0 0 6px 0; font-size: 16px; color: #ffffff; }
        .ex-info p { margin: 0; font-size: 14px; color: #aaaaaa; }
        .ex-info p span { color: #FF5500; }
        .workout-gif-window { width: 100%; height: 220px; background-color: #111111; border-radius: 8px; overflow: hidden; border: 1px solid #222222; }
        .workout-gif-window video { width: 100%; height: 100%; object-fit: cover; }
        #active-workout-hud { display: none; flex-direction: column; align-items: center; gap: 20px; margin-bottom: 30px; width: 100%; }
        .hud-card { background-color: #050505; border: 1px solid #FF5500; width: 100%; border-radius: 12px; padding: 20px; text-align: center; }
        .hud-exercise-title { font-family: 'Orbitron', sans-serif; font-size: 20px; color: #ffffff; margin: 0 0 10px 0; }
        .hud-set-metrics { font-family: 'Orbitron', sans-serif; font-size: 15px; color: #FF5500; margin-bottom: 15px; }
        .timer-module { background-color: #111111; border: 1px solid #222222; border-radius: 10px; padding: 20px; width: 100%; text-align: center; cursor: pointer; }
        .timer-label { font-family: 'Orbitron', sans-serif; font-size: 11px; color: #666666; margin-bottom: 5px; text-transform: uppercase; }
        .timer-display { font-family: 'Orbitron', sans-serif; font-size: 42px; font-weight: 900; color: #ffffff; }
        .timer-display.critical { color: #FF5500; }
        .primary-btn { font-family: 'Orbitron', sans-serif; width: 100%; padding: 16px; background-color: #FF5500; color: #000000; border: none; border-radius: 8px; font-size: 15px; font-weight: 900; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
        .primary-btn.complete-mode { background-color: #00ff55; }
    </style>
</head>
<body>

    <!-- VISIBILITY SECURED LOADING SCREENS -->
    <div id="loading-splash">
        <h1 class="splash-title">IRON<span>TIME</span></h1>
        <div class="spinner-circle"></div>
    </div>

    <div id="app-overlay" class="drawer-overlay" onclick="closeSideMenu()"></div>

    <nav id="app-drawer" class="side-drawer">
        <div class="drawer-header">
            <h2>Progress Hub</h2>
            <button class="close-drawer-btn" onclick="closeSideMenu()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-nav-container">
            <button class="drawer-link" onclick="toggleProgressHubPanel()">
                <span>Progress Chart</span><i id="hub-chevron" class="fa-solid fa-chevron-down"></i>
            </button>
            <div id="progress-hub-panel" class="sub-panel">
                <div id="calendar-month-header" style="color:#FF5500; font-family:'Orbitron'; font-size:14px; margin-bottom:10px;">JULY 2026</div>
                <div class="calendar-grid" id="drawer-calendar-mesh"></div>
            </div>
        </div>
    </nav>

    <!-- VIEW 1: MAIN DASHBOARD -->
    <main id="view-home" class="app-view active">
        <div class="app-container">
            <header class="top-navbar">
                <button class="menu-btn" onclick="openSideMenu()"><i class="fa-solid fa-bars"></i></button>
                <h1 class="logo-title">IRON<span>TIME</span></h1>
                <div style="width:32px;"></div>
            </header>
            <section class="week-grid" id="main-week-matrix"></section>
        </div>
    </main>

    <!-- VIEW 2: WORKOUT PLAN -->
    <main id="view-workout" class="app-view">
        <div class="app-container">
            <div class="routine-header">
                <button class="back-btn" onclick="switchActiveView('view-home')"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 id="day-title-header" style="margin:0; font-family:'Orbitron';">Workout Plan</h2>
            </div>
            <div class="meta-container">
                <div class="meta-box"><span class="meta-label">TIME:</span><span class="meta-value">~45 MIN</span></div>
                <div class="meta-box"><span class="meta-label">REST:</span><span class="meta-value">60 SEC</span></div>
                <div class="meta-box"><span class="meta-label">SPLIT:</span><span id="target-focus-value" class="meta-value">LOADING</span></div>
            </div>
            <div id="overview-zone">
                <div id="workout-vault" class="exercise-list"></div>
                <button class="primary-btn" onclick="startInteractiveWorkout()">Start Workout</button>
            </div>
            <div id="active-workout-hud">
                <div class="hud-card">
                    <h3 id="hud-exercise-name" class="hud-exercise-title">EXERCISE NAME</h3>
                    <div id="hud-set-counter" class="hud-set-metrics">SET 1 OF 4</div>
                    <div class="workout-gif-window">
                        <video id="hud-video-display" autoplay loop muted playsinline><source id="hud-video-source" type="video/mp4"></video>
                    </div>
                </div>
                <div class="timer-module" onclick="triggerRestTimer()">
                    <div id="timer-status-text" class="timer-label">Tap to start rest</div>
                    <div id="countdown-clock" class="timer-display">60s</div>
                </div>
                <button id="hud-action-btn" class="primary-btn" onclick="skipOrAdvanceSet()">Skip Timer</button>
            </div>
        </div>
    </main>

    <script>
        const exerciseDataBank = {
            "Monday": { focus: "Chest & Triceps", moves: [{ name: "Dumbbell Floor Press", stats: "15 Reps", sets: 4, img: "https://files.catbox.moe/kp27ib.mp4" }, { name: "Standard Push-ups", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/s2rqzi.mp4" }, { name: "Decline Push-ups", stats: "10 Reps", sets: 3, img: "https://files.catbox.moe/nwoem7.mp4" }, { name: "Overhead Dumbbell Tricep Extension", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/hrpwyd.mp4" }, { name: "Chair or Bench Dips", stats: "15 Reps", sets: 3, img: "https://files.catbox.moe/i4ql6k.mp4" }, { name: "Diamond Push-ups", stats: "To Failure", sets: 3, img: "https://files.catbox.moe/g99k8u.mp4" }] },
            "Tuesday": { focus: "Shoulder & Bicep", moves: [{ name: "Dumbbell Shoulder Press", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/699d62.mp4" }, { name: "Dumbbell Lateral Raises", stats: "15 Reps", sets: 4, img: "https://files.catbox.moe/2zncg6.mp4" }, { name: "Dumbbell Rear Delt Flyes", stats: "15 Reps", sets: 4, img: "https://files.catbox.moe/9v5xjd.mp4" }, { name: "Dumbbell Bicep Curls", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/7a2mai.mp4" }, { name: "Dumbbell Hammer Curls", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/td39uz.mp4" }, { name: "Pike Push-ups", stats: "8-10 Reps", sets: 3, img: "https://files.catbox.moe/db3ut5.mp4" }] },
            "Wednesday": { focus: "Legs", moves: [{ name: "Dumbbell Goblet Squats", stats: "15 Reps", sets: 4, img: "https://files.catbox.moe/mce4ys.mp4" }, { name: "Dumbbell Bulgarian Split Squats", stats: "12 Reps", sets: 3, img: "https://files.catbox.moe/hrx0yt.mp4" }, { name: "Dumbbell Romanian Deadlifts", stats: "15 Reps", sets: 4, img: "https://files.catbox.moe/m58qpu.mp4" }, { name: "Walking Lunges", stats: "20 Steps", sets: 3, img: "https://files.catbox.moe/5eb9n4.mp4" }, { name: "Calf Raises", stats: "20 Reps", sets: 4, img: "https://files.catbox.moe/ro3u86.mp4" }] },
            "Thursday": { focus: "Abs (Core)", moves: [{ name: "Plank Shoulder Taps", stats: "45 Sec", sets: 4, img: "https://files.catbox.moe/kf5a81.mp4" }, { name: "Bicycle Crunches", stats: "20 Reps", sets: 3, img: "https://files.catbox.moe/1wtf9l.mp4" }, { name: "Lying Leg Raises", stats: "15 Reps", sets: 3, img: "https://files.catbox.moe/e2va8y.mp4" }, { name: "Russian Twists", stats: "20 Reps", sets: 3, img: "https://files.catbox.moe/e5rdnf.mp4" }] },
            "Friday": { focus: "Chest & Triceps", moves: [{ name: "Dumbbell Floor Press", stats: "15 Reps", sets: 4, img: "https://files.catbox.moe/kp27ib.mp4" }, { name: "Standard Push-ups", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/s2rqzi.mp4" }, { name: "Decline Push-ups", stats: "10 Reps", sets: 3, img: "https://files.catbox.moe/nwoem7.mp4" }, { name: "Overhead Dumbbell Tricep Extension", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/hrpwyd.mp4" }] },
            "Saturday": { focus: "Shoulder & Bicep", moves: [{ name: "Dumbbell Shoulder Press", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/699d62.mp4" }, { name: "Dumbbell Lateral Raises", stats: "15 Reps", sets: 4, img: "https://files.catbox.moe/2zncg6.mp4" }, { name: "Dumbbell Bicep Curls", stats: "12 Reps", sets: 4, img: "https://files.catbox.moe/7a2mai.mp4" }] },
            "Sunday": { focus: "Rest Day", moves: [{ name: "Full Recovery Rest", stats: "Relax", sets: 1, img: "https://images.unsplash.com/photo-1605296867304-46d5465a25f1?auto=format&fit=crop&w=400&q=80" }] }
        };

        let currentExerciseIndex = 0, currentSetIndex = 1, countdownRunning = null, remainingSeconds = 60, chosenDay = "Monday", trackingMovesList = [];

        function switchActiveView(viewId) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (viewId === 'view-home') compileWeeklyStatusDashboard();
        }

        function openSideMenu() { document.getElementById('app-drawer').classList.add('open'); document.getElementById('app-overlay').classList.add('visible'); buildSecureCalendarMatrix(); }
        function closeSideMenu() { document.getElementById('app-drawer').classList.remove('open'); document.getElementById('app-overlay').classList.remove('visible'); }
        function toggleProgressHubPanel() { document.getElementById('progress-hub-panel').classList.toggle('active'); }

        function compileWeeklyStatusDashboard() {
            const now = new Date();
            const dateKey = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const logDatabase = JSON.parse(localStorage.getItem('ironTimeLogs') || '{}');
            const mainMatrix = document.getElementById('main-week-matrix');
            mainMatrix.innerHTML = '';

            ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"].forEach(day => {
                let txt = exerciseDataBank[day].focus, cls = "";
                if (logDatabase[dateKey] && now.toLocaleDateString('en-US', {weekday: 'long'}) === day) { txt = "COMPLETED TODAY"; cls = "completed"; }
                mainMatrix.insertAdjacentHTML('beforeend', `<div class="day-panel ${cls}" onclick="loadWorkoutInterface('${day}')"><div class="day-meta"><h3>${day}</h3><p>${txt}</p></div><div class="action-arrow"><i class="fa-solid fa-chevron-right"></i></div></div>`);
            });
        }

        function buildSecureCalendarMatrix() {
            const grid = document.getElementById('drawer-calendar-mesh'); grid.innerHTML = '';
            ["S", "M", "T", "W", "T", "F", "S"].forEach(h => grid.insertAdjacentHTML('beforeend', `<div class="calendar-header-day">${h}</div>`));
            const now = new Date(), y = now.getFullYear(), m = now.getMonth();
            const total = new Date(y, m + 1, 0).getDate(), start = new Date(y, m, 1).getDay();
            const logDatabase = JSON.parse(localStorage.getItem('ironTimeLogs') || '{}');

            for (let i = 0; i < start; i++) grid.insertAdjacentHTML('beforeend', '<div style="visibility:hidden"></div>');
            for (let d = 1; d <= total; d++) {
                const k = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
                grid.insertAdjacentHTML('beforeend', `<div class="calendar-day-node ${logDatabase[k]?'logged':''}">${d}</div>`);
            }
        }

        function loadWorkoutInterface(dayName) {
            chosenDay = dayName; trackingMovesList = exerciseDataBank[chosenDay].moves;
            currentExerciseIndex = 0; currentSetIndex = 1;
            document.getElementById('day-title-header').innerText = `${chosenDay} Routine`;
            document.getElementById('target-focus-value').innerText = exerciseDataBank[chosenDay].focus;
            document.getElementById('overview-zone').style.display = 'block';
            document.getElementById('active-workout-hud').style.display = 'none';

            const vault = document.getElementById('workout-vault'); vault.innerHTML = '';
            trackingMovesList.forEach(m => {
                const isVid = m.img.endsWith('.mp4');
                vault.insertAdjacentHTML('beforeend', `<div class="exercise-card"><div class="ex-info"><h4>${m.name}</h4><p>Target: <span>${m.sets} x ${m.stats}</span></p></div><div class="workout-gif-window">${isVid?`<video autoplay loop muted playsinline><source src="${m.img}" type="video/mp4"></video>`:`<img src="${m.img}">`}</div></div>`);
            });
            switchActiveView('view-workout');
        }

        function startInteractiveWorkout() { document.getElementById('overview-zone').style.display = 'none'; document.getElementById('active-workout-hud').style.display = 'flex'; renderHudExercise(); }

        function renderHudExercise() {
            const move = trackingMovesList[currentExerciseIndex];
            document.getElementById('hud-exercise-name').innerText = move.name;
            document.getElementById('hud-set-counter').innerText = `SET ${currentSetIndex} OF ${move.sets} — ${move.stats}`;
            const v = document.getElementById('hud-video-display');
            document.getElementById('hud-video-source').src = move.img;
            v.load(); v.play().catch(()=>{});

            clearInterval(countdownRunning); countdownRunning = null; remainingSeconds = 60;
            document.getElementById('countdown-clock').innerText = "60s";
            document.getElementById('timer-status-text').innerText = "Tap to start rest interval";
            document.getElementById('hud-action-btn').innerText = "Skip Timer";
        }

        function triggerRestTimer() {
            if (countdownRunning !== null) return;
            document.getElementById('timer-status-text').innerText = "RESTING...";
            countdownRunning = setInterval(() => {
                remainingSeconds--;
                document.getElementById('countdown-clock').innerText = `${remainingSeconds}s`;
                if (remainingSeconds <= 0) { clearInterval(countdownRunning); countdownRunning = null; advanceToNextSegment(); }
            }, 1000);
        }

        function skipOrAdvanceSet() { if (countdownRunning) { clearInterval(countdownRunning); countdownRunning = null; } advanceToNextSegment(); }

        function advanceToNextSegment() {
            const move = trackingMovesList[currentExerciseIndex];
            if (currentSetIndex < move.sets) { currentSetIndex++; renderHudExercise(); }
            else if (currentExerciseIndex < trackingMovesList.length - 1) { currentExerciseIndex++; currentSetIndex = 1; renderHudExercise(); }
            else {
                document.getElementById('timer-status-text').innerText = "COMPLETED!";
                document.getElementById('countdown-clock').innerText = "DONE";
                const btn = document.getElementById('hud-action-btn'); btn.innerText = "FINISH"; btn.onclick = finishWorkout;
            }
        }

        function finishWorkout() {
            const now = new Date();
            const k = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
            const logs = JSON.parse(localStorage.getItem('ironTimeLogs') || '{}');
            logs[k] = 'completed'; localStorage.setItem('ironTimeLogs', JSON.stringify(logs));
            switchActiveView('view-home');
        }

        // CONTROL RUN ENGINE
        window.addEventListener('DOMContentLoaded', () => {
            compileWeeklyStatusDashboard();
            
            // Forces the splash screen to fade away after 2.5 seconds cleanly
            setTimeout(() => {
                document.getElementById('loading-splash').classList.add('hidden');
            }, 2500);
        });
    </script>
</body>
</html>
