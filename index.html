<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IRONTIME - Workout Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 500;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        .hidden { display: none !important; }
        h1, h2, h3, .preview-header-title, .timer-display, .primary-btn {
            font-family: 'Orbitron', sans-serif;
        }
        .container { width: 100%; max-width: 420px; padding: 20px; box-sizing: border-box; }
        
        /* Interface 4: Preview List Elements */
        .preview-header-title { color: #FF5500; font-size: 22px; text-transform: uppercase; margin-bottom: 5px; font-weight: 900; }
        .preview-subtitle { font-size: 14px; color: #666; margin-bottom: 25px; text-transform: uppercase; font-weight: 700; }
        .exercise-vertical-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .ex-list-row { display: flex; align-items: center; background-color: #0c0c0c; border: 1px solid #1c1c1c; border-radius: 10px; padding: 15px; gap: 15px; }
        .ex-row-index { font-family: 'Orbitron', sans-serif; font-size: 18px; color: #333; font-weight: 900; width: 25px; }
        .ex-row-details { flex: 1; }
        .ex-row-name { font-size: 16px; font-weight: 700; color: #fff; text-transform: uppercase; margin-bottom: 2px; }
        .ex-row-meta { font-size: 13px; color: #FF5500; font-weight: 700; text-transform: uppercase; }
        
        .primary-btn { width: 100%; padding: 16px; background-color: #FF5500; color: black; border: none; border-radius: 8px; font-size: 16px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        /* Interface 5: Active Engine Layout */
        .tracker-header-tier { font-family: 'Orbitron', sans-serif; font-size: 12px; color: #FF5500; text-transform: uppercase; font-weight: 800; letter-spacing: 2px; text-align: center; margin-bottom: 5px; }
        .tracker-ex-name { font-size: 24px; font-weight: 900; text-transform: uppercase; text-align: center; margin: 0 0 5px 0; color: #fff; }
        .tracker-ex-meta { font-size: 14px; color: #666; text-transform: uppercase; font-weight: 700; text-align: center; margin-bottom: 25px; }
        
        .kinetic-display-box { width: 100%; height: 220px; background: linear-gradient(180deg, #050505 0%, #0d0d0d 100%); border: 1px dashed #222; border-radius: 16px; margin-bottom: 30px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .kinetic-display-box::before { content: ''; position: absolute; width: 200%; height: 200%; background-image: linear-gradient(rgba(255,85,0,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,85,0,0.02) 1px, transparent 1px); background-size: 20px 20px; animation: gridShift 8s linear infinite; }
        @keyframes gridShift { 0% { transform: translateY(0); } 100% { transform: translateY(-40px); } }
        
        .humanoid-wireframe { width: 50px; height: 90px; border: 2px solid #FF5500; border-radius: 20px; position: relative; box-shadow: 0 0 20px rgba(255,85,0,0.3); animation: kineticPulse 1.5s ease-in-out infinite alternate; z-index: 2; }
        .humanoid-wireframe::after { content: ''; position: absolute; top: -25px; left: 12px; width: 22px; height: 22px; border: 2px solid #FF5500; border-radius: 50%; box-shadow: 0 0 15px rgba(255,85,0,0.3); }
        @keyframes kineticPulse { 0% { transform: scale(0.95) rotate(-5deg); border-color: #FF5500; } 100% { transform: scale(1.05) rotate(5deg); border-color: #00E5FF; } }

        .timer-wrapper-row { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 10px; }
        .timer-display { font-size: 64px; font-weight: 900; color: #ffffff; text-shadow: 0 0 25px rgba(255,255,255,0.2); min-width: 160px; text-align: center; }
        .timer-display.rest-mode { color: #00FF66; text-shadow: 0 0 25px rgba(0,255,102,0.3); }
        .time-injector-btn { background-color: #111; border: 1px solid #333; color: #fff; padding: 10px 14px; border-radius: 8px; font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 800; cursor: pointer; }
        
        .skip-action-trigger { font-family: 'Orbitron', sans-serif; font-size: 14px; color: #666; text-transform: uppercase; font-weight: 900; cursor: pointer; margin-bottom: 40px; display: block; text-align: center; }
        .master-control-row { display: flex; align-items: center; justify-content: space-between; padding: 0 30px; margin-bottom: 20px; }
        .nav-arrow { font-size: 32px; color: #FF5500; cursor: pointer; user-select: none; }
        .nav-arrow.disabled-edge { opacity: 0.15 !important; cursor: not-allowed; pointer-events: none; }
        .master-toggle-btn { width: 140px; padding: 15px 0; background-color: #fff; color: #000; border-radius: 30px; font-family: 'Orbitron', sans-serif; font-size: 16px; font-weight: 900; text-transform: uppercase; cursor: pointer; border: none; }
        .master-toggle-btn.paused { background-color: #FF5500; color: #000; }
    </style>
</head>
<body>

    <div id="screen-preview-list" class="container">
        <div class="preview-header-title" id="preview-tier-title">Workout Routine</div>
        <div class="preview-subtitle" id="preview-target-day">TODAY'S EXERCISES</div>
        <div class="exercise-vertical-list" id="vertical-preview-injection-point"></div>
        <button class="primary-btn" onclick="startActiveWorkoutEngine()">Start Workout Routine</button>
    </div>

    <div id="screen-workout-tracker" class="container hidden">
        <div class="tracker-header-tier" id="tracker-current-tier">TIER ENGINE</div>
        <h2 class="tracker-ex-name" id="tracker-current-name">EXERCISE NAME</h2>
        <div class="tracker-ex-meta" id="tracker-current-meta">SET TRACKER</div>

        <div class="kinetic-display-box"><div class="humanoid-wireframe"></div></div>

        <div class="timer-wrapper-row">
            <div style="width:50px;"></div>
            <div class="timer-display" id="main-timer-countdown">00:45</div>
            <button class="time-injector-btn" onclick="injectTwentySeconds()">+20s</button>
        </div>
        
        <div class="skip-action-trigger" id="skip-link-element" onclick="skipCurrentTimerState()">SKIP REST TIME</div>

        <div class="master-control-row">
            <div class="nav-arrow" id="nav-arrow-left" onclick="navigateActiveWorkoutStream(-1)"><i class="fa-solid fa-angle-left"></i></div>
            <button class="master-toggle-btn" id="master-state-toggle-btn" onclick="toggleTimerExecutionState()">STOP</button>
            <div class="nav-arrow" id="nav-arrow-right" onclick="navigateActiveWorkoutStream(1)"><i class="fa-solid fa-angle-right"></i></div>
        </div>
    </div>

    <script>
        const exerciseRoutineDatabase = {
            "Monday": [
                { name: "Incline Dumbbell Press", sets: 4, reps: 12, duration: 45 },
                { name: "Flat Bench Barbell Press", sets: 4, reps: 10, duration: 45 },
                { name: "Rope Overhead Tricep Extension", sets: 3, reps: 15, duration: 30 }
            ],
            "Tuesday": [
                { name: "Overhead Shoulder Press", sets: 4, reps: 12, duration: 45 },
                { name: "Dumbbell Lateral Raises", sets: 4, reps: 15, duration: 30 },
                { name: "Incline Bicep Curls", sets: 4, reps: 12, duration: 45 }
            ],
            "Wednesday": [
                { name: "Barbell Back Squats", sets: 4, reps: 10, duration: 60 },
                { name: "Leg Press Matrix", sets: 4, reps: 12, duration: 45 }
            ],
            "Thursday": [{ name: "Active Recovery Flow", sets: 1, reps: "15 Min", duration: 90 }],
            "Friday": [{ name: "Hanging Leg Raises", sets: 4, reps: 15, duration: 30 }],
            "Saturday": [{ name: "Deadlifts", sets: 4, reps: 8, duration: 60 }],
            "Sunday": [{ name: "Rest & Stretch Flow", sets: 1, reps: "20 Min", duration: 120 }]
        };

        const daysArray = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const currentDayName = daysArray[new Date().getDay()];

        let currentSelectedTier = localStorage.getItem('selectedTier') || 'Beginner';
        let currentExerciseIndex = 0;
        let currentExerciseSetsTrack = 1;
        let isTimerActiveState = false;
        let timerCountdownSeconds = 0;
        let activeTimerIntervalTracker = null;
        let isCurrentStateRestPeriod = false;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('preview-tier-title').innerText = `${currentSelectedTier} Routine`;
            document.getElementById('preview-target-day').innerText = `TODAY'S ${currentDayName.toUpperCase()} EXERCISES`;
            
            const listContainer = document.getElementById('vertical-preview-injection-point');
            const targetedExercises = exerciseRoutineDatabase[currentDayName];
            
            targetedExercises.forEach((ex, idx) => {
                const row = document.createElement('div');
                row.classList.add('ex-list-row');
                row.innerHTML = `
                    <div class="ex-row-index">0${idx + 1}</div>
                    <div class="ex-row-details">
                        <div class="ex-row-name">${ex.name}</div>
                        <div class="ex-row-meta">${ex.sets} SETS × ${ex.reps} REPS</div>
                    </div>
                `;
                listContainer.appendChild(row);
            });
        });

        function startActiveWorkoutEngine() {
            document.getElementById('screen-preview-list').classList.add('hidden');
            document.getElementById('screen-workout-tracker').classList.remove('hidden');
            initializeTargetExerciseState();
        }

        function initializeTargetExerciseState() {
            clearInterval(activeTimerIntervalTracker);
            isTimerActiveState = true;
            document.getElementById('master-state-toggle-btn').innerText = "STOP";
            document.getElementById('master-state-toggle-btn').classList.remove('paused');
            
            const activeList = exerciseRoutineDatabase[currentDayName];
            const currentWorkoutObj = activeList[currentExerciseIndex];
            
            document.getElementById('tracker-current-tier').innerText = `${currentSelectedTier} TIER • EXERCISE ${currentExerciseIndex + 1} OF ${activeList.length}`;
            document.getElementById('tracker-current-name').innerText = currentWorkoutObj.name;
            
            if (!isCurrentStateRestPeriod) {
                document.getElementById('tracker-current-meta').innerText = `SET ${currentExerciseSetsTrack} OF ${currentWorkoutObj.sets} • ${currentWorkoutObj.reps} REPS`;
                timerCountdownSeconds = currentWorkoutObj.duration;
                document.getElementById('main-timer-countdown').classList.remove('rest-mode');
                document.getElementById('skip-link-element').style.visibility = 'hidden';
            } else {
                document.getElementById('tracker-current-meta').innerText = "REST PERIOD • BREATHE";
                timerCountdownSeconds = 45; 
                document.getElementById('main-timer-countdown').classList.add('rest-mode');
                document.getElementById('skip-link-element').style.visibility = 'visible';
            }
            
            refreshTimerTextDisplay();
            updateNavigationArrowsState();
            activeTimerIntervalTracker = setInterval(runTimerCountdownProcessor, 1000);
        }

        function runTimerCountdownProcessor() {
            if (!isTimerActiveState) return;
            if (timerCountdownSeconds > 0) {
                timerCountdownSeconds--;
                refreshTimerTextDisplay();
            } else {
                handleTimerPhaseCompletion();
            }
        }

        function handleTimerPhaseCompletion() {
            clearInterval(activeTimerIntervalTracker);
            const activeList = exerciseRoutineDatabase[currentDayName];
            const currentWorkoutObj = activeList[currentExerciseIndex];
            
            if (!isCurrentStateRestPeriod) {
                isCurrentStateRestPeriod = true;
                initializeTargetExerciseState();
            } else {
                isCurrentStateRestPeriod = false;
                if (currentExerciseSetsTrack < currentWorkoutObj.sets) {
                    currentExerciseSetsTrack++;
                } else {
                    currentExerciseSetsTrack = 1;
                    if (currentExerciseIndex < activeList.length - 1) {
                        currentExerciseIndex++;
                    } else {
                        triggerWorkoutSignOffSequence();
                        return;
                    }
                }
                initializeTargetExerciseState();
            }
        }

        function refreshTimerTextDisplay() {
            const mins = Math.floor(timerCountdownSeconds / 60);
            const secs = timerCountdownSeconds % 60;
            document.getElementById('main-timer-countdown').innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function injectTwentySeconds() { timerCountdownSeconds += 20; refreshTimerTextDisplay(); }
        function skipCurrentTimerState() { timerCountdownSeconds = 0; handleTimerPhaseCompletion(); }

        function toggleTimerExecutionState() {
            isTimerActiveState = !isTimerActiveState;
            const btn = document.getElementById('master-state-toggle-btn');
            btn.innerText = isTimerActiveState ? "STOP" : "START";
            btn.classList.toggle('paused', !isTimerActiveState);
        }

        function navigateActiveWorkoutStream(direction) {
            const activeList = exerciseRoutineDatabase[currentDayName];
            const newTargetIdx = currentExerciseIndex + direction;
            if (newTargetIdx >= 0 && newTargetIdx < activeList.length) {
                currentExerciseIndex = newTargetIdx;
                currentExerciseSetsTrack = 1;
                isCurrentStateRestPeriod = false;
                initializeTargetExerciseState();
            }
        }

        function updateNavigationArrowsState() {
            document.getElementById('nav-arrow-left').classList.toggle('disabled-edge', currentExerciseIndex === 0);
            document.getElementById('nav-arrow-right').classList.toggle('disabled-edge', currentExerciseIndex === exerciseRoutineDatabase[currentDayName].length - 1);
        }

        function triggerWorkoutSignOffSequence() {
            clearInterval(activeTimerIntervalTracker);
            let completeAction = confirm("WORKOUT COMPLETE!\n\nClick OK to mark this session as completed.");
            if (completeAction) {
                const statusKey = `workout_status_${new Date().getMonth()}_${new Date().getDate()}`;
                localStorage.setItem(statusKey, 'done');
            }
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
