<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IronTime | Initialization</title>
    <style>
        body {
            background: #000;
            color: #fff;
            font-family: -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-direction: column;
        }

        /* Container to center everything */
        .intro-container {
            position: relative;
            width: 90%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        /* The Logo (Initial State) */
        #logo {
            font-size: 3.5rem;
            font-weight: 900;
            color: #ff6b00;
            letter-spacing: 5px;
            opacity: 1;
            position: absolute; /* Keep it centered while quote loads */
            transition: opacity 0.5s ease;
        }

        /* Shatter Animation Simulation */
        .shatter {
            animation: shatter-sim 0.6s ease-out forwards;
            pointer-events: none;
        }

        @keyframes shatter-sim {
            0% { transform: scale(1); opacity: 1; filter: blur(0px); }
            30% { transform: scale(1.1) rotate(1deg); filter: blur(1px); }
            100% { transform: scale(2); opacity: 0; filter: blur(10px); }
        }

        /* The Quote Area */
        #quote-text {
            color: #ccc;
            font-size: 1.1rem;
            line-height: 1.5;
            text-align: center;
            font-weight: 300;
            min-height: 3em; /* Reserve space so layout doesn't jump */
            opacity: 0; /* Hidden initially */
            transition: opacity 1s ease 0.6s; /* Fade in AFTER shatter */
        }

        /* Temporary display for main UI */
        #main-ui-placeholder {
            display: none;
            color: #ff6b00;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink { 0% {opacity: 1} 50% {opacity: 0} 100% {opacity: 1} }

    </style>
</head>
<body>

    <div class="intro-container">
        <div id="logo">IRONTIME</div>

        <div id="quote-text"></div>
        
        <div id="main-ui-placeholder">LOAD_SYSTEM_PROFILE...</div>
    </div>

    <script>
        // The Quote Database
        const quotes = [
            "THE ONLY BAD WORKOUT IS THE ONE THAT DIDN'T HAPPEN.",
            "DISCIPLINE DOESN'T CARE HOW YOU FEEL.",
            "TRAIN INSANE OR REMAIN THE SAME.",
            "FOCUS. FORGE. FINISH.",
            "STAY HUNGRY. STAY HUMBLE.",
            "DO TODAY WHAT OTHERS WON'T."
        ];

        // Typewriter Effect
        function typeWriter(text, i, fnCallback) {
            if (i < text.length) {
                document.getElementById("quote-text").innerHTML = text.substring(0, i+1) + '<span aria-hidden="true" style="color:#ff6b00;">|</span>';
                setTimeout(function() {
                    typeWriter(text, i + 1, fnCallback)
                }, 40; // Typing speed (smaller = faster)
            } else if (typeof fnCallback == 'function') {
                setTimeout(fnCallback, 4000); // Wait 4 seconds after finishing before moving to next screen
            }
        }

        // Logic for "One Quote Per Day"
        function getDailyQuote() {
            const today = new Date().toDateString();
            let dailyQuote = localStorage.getItem('iron_daily_quote');
            let lastDate = localStorage.getItem('iron_quote_date');

            if (lastDate !== today) {
                // It's a new day! Pick a fresh quote.
                dailyQuote = quotes[Math.floor(Math.random() * quotes.length)];
                localStorage.setItem('iron_daily_quote', dailyQuote);
                localStorage.setItem('iron_quote_date', today);
            }
            return dailyQuote;
        }

        // Main Sequence Execution
        window.onload = function() {
            const logo = document.getElementById('logo');
            const quoteArea = document.getElementById('quote-text');
            const dailyQuote = getDailyQuote();

            // Sequence 1: Boot Delay (wait 1.5s)
            setTimeout(() => {
                
                // Sequence 2: The Shatter (apply class to trigger animation)
                logo.classList.add('shatter');

                // Sequence 3: Typewriter (start typing the quote)
                // We also fade in the quote area (CSS transition)
                quoteArea.style.opacity = "1";
                typeWriter(dailyQuote, 0, function() {
                    
                    // Sequence 4: Transition to next step (Onboarding form)
                    quoteArea.style.opacity = "0"; // Fade out quote
                    setTimeout(() => {
                        quoteArea.style.display = "none";
                        // Now we activate the "System Profile" loader (where step 2 will live)
                        document.getElementById('main-ui-placeholder').style.display = 'block';
                        
                        // Later, this is where we would trigger `checkUserSetup()`!
                        console.log("Intro complete. Next Step: System Onboarding.");
                    }, 1000); 
                });
            }, 1500); // Initial boot delay
        };
    </script>
</body>
</html>
