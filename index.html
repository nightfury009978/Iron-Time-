<html lang="en">

    <title>IRONTIME</title>

        body {

            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-y: auto; /* Enables smooth scrolling down the dashboard */
        }

        .hidden { display: none !important; }

        /* ==========================================
           INTERFACE 1: LOADING SCREEN STYLES
           ========================================== */
        .loading-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100%;
        }
        .brand-title {
            color: #FF5500;
            font-size: 3rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 20px;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 85, 0, 0.1);
            border-top-color: #FF5500;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
